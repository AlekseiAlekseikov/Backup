<script>
/* ============================================================
   МОСТ UI ↔ Kotlin (фаза 1 — только интерфейс).
   В браузере этот блок ничего не меняет: пока нет
   window.GeelyNative, все вызовы — тихие заглушки.
   Нативная сторона: ui/UiBridge.kt.
   События фазы 2: car.*, drive.*, climate.*, voice.*,
   settings.*, tab.*, tool.*, option.*, toast, ui.ready.
   ============================================================ */
(function(){
  var N = window.GeelyNative || null;
  function emit(name, data){
    if(!N) return;
    try{ N.onEvent(name, JSON.stringify(data || {})); }catch(e){}
  }
  window.__geelyEmit = emit;

  /* Действующая палитра шелла → нативная сторона (зеркалится во
     Flutter-prefs телеметрии). Boot-вызов applyTheme() прошёл до
     объявления emit, поэтому стартовое значение шлём здесь. */
  emit('ui.theme', {id: THEME_IDS[(SET.follow && SET.gu === 'dark') ? 1 : setTheme] || 'dark'});

  /* Каждый тост макета дублируется в нативный канал */
  var _say = say;
  say = function(m){ _say(m); emit('toast', {message: String(m)}); };

  /* Смена вкладки */
  var _select = select;
  select = function(id){
    /* Замер дока — ДО tab.change: на нативной стороне show() строит
       FlutterView по уже известному вырезу (отступ + масштаб) за один раз.
       Палитра едет в самом событии — страховка от любых гонок порядка. */
    /* Stage NAV-MAP: вырез под док нужен и нативной карте (вкладка 'navi'),
       замер общий для всех нативных слоёв шелла. */
    if(id === 'telemetry' || id === 'navi') telFrame();
    emit('tab.change', {id: id, theme: THEME_IDS[(SET.follow && SET.gu === 'dark') ? 1 : setTheme] || 'dark'});
    _select(id);
    if(id === 'telemetry') emit('telemetry.request', {});
  };

  /* GeelyTools: встроенный Flutter-экран телеметрии занимает область над
     плавающим доком. Меряем .tabbar (rect × dpr — физические пиксели, тот же
     приём, что projectionFrame) и шлём нижний отступ нативной стороне. */
  function telFrame(){
    var tb = document.querySelector('.tabbar'); if(!tb) return;
    var r = tb.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    emit('telemetry.frame', {bottomInset: Math.max(0, (window.innerHeight - r.top + 8) * d)});
  }
  window.addEventListener('resize', function(){ if(curId === 'telemetry' || curId === 'navi') telFrame(); });

  /* Нативная сторона просит показать вкладку (telemetry.open из карточки
     батареи / баннера зарядки): подсветка дока + обычный путь select. */
  window.addEventListener('native:ui.selectTab', function(ev){
    var id = ((ev && ev.detail) || {}).id;
    if (id && curId !== id) select(id);
  });

  /* Делегированные события по ключевым элементам.
     Слушатель на document срабатывает ПОСЛЕ собственных onclick
     элементов, поэтому состояние читается уже обновлённым. */
  document.addEventListener('click', function(e){
    var el = (e.target && e.target.closest) ? e.target.closest(
      '.mode,.air,.heat,.seat,.dot,#battBar,#micBtn,#callAssist,#micRestart'
    ) : null;
    if(!el) return;
    if(el.classList.contains('mode')) emit('drive.mode', {mode: el.getAttribute('data-v')});
    else if(el.classList.contains('air')) emit(el.classList.contains('tog') ? 'climate.recirc' : 'climate.air', {value: el.getAttribute('data-v'), on: el.classList.contains('sel')});
    else if(el.classList.contains('heat')) emit('climate.heat', {name: el.getAttribute('data-v'), on: el.classList.contains('on')});
    else if(el.classList.contains('seat')) emit('climate.seat', {name: el.getAttribute('data-v'), level: el.querySelectorAll('.lvl s.f').length});
    else if(el.classList.contains('dot')) emit('car.color', {color: el.getAttribute('data-c')});
    else if(el.id === 'battBar') emit('car.charging', {charging: el.classList.contains('charging')});
    else if(el.id === 'micBtn' || el.id === 'callAssist') emit('voice.request', {});
    else if(el.id === 'micRestart') emit('voice.micRestart', {});
  }, false);

  document.addEventListener('change', function(e){
    var t = e.target;
    if(!(t && t.matches && t.matches('.sw input,.cx-toggle input'))) return;
    if(t.getAttribute('data-k')) emit('settings.change', {key: t.getAttribute('data-k'), value: t.checked});
    else emit('option.change', {name: t.getAttribute('data-n'), value: t.checked});
  }, false);

  /* Stage CXT: состояние и readback настроек вкладки «Инструменты» */
  window.addEventListener('native:tools.state', function(ev){
    toolsApplyState((ev && ev.detail) || {});
    if(curId === 'tools'){ cxRepaintNav(); }
  });

  /* Kotlin → JS: точка входа для пушей данных (батарея, голос, обновления) */
  window.__nativeEvent = function(name, data){
    window.dispatchEvent(new CustomEvent('native:' + name, {detail: data}));
  };

  /* Кнопка «Назад» Android: закрыть модалку, иначе выходим */
  window.__nativeBack = function(){
    if(document.querySelector('.mBack') && typeof closeModal === 'function'){ closeModal(); return true; }
    return false;
  };

  /* Реальные данные телеметрии из движка (Kotlin → JS, Stage B) */
  window.addEventListener('native:telemetry.data', function(ev){
    var d = ev && ev.detail; if(!d) return;
    if(d.trips){ TEL.trips = d.trips; TEL.native = true; }
    if(d.charges) TEL.charges = d.charges;
    if(d.status) TEL.status = d.status;
    if(d.range) TEL.range = d.range;
    if(d.sync) TEL.sync = d.sync;
    if(d.settings){
      TEL.set = d.settings;
      if(d.settings.packWh) packWh = +d.settings.packWh;
      if(d.settings.rate != null) rate = +d.settings.rate;
    }
    if(d.series) TEL.series = d.series;
    if(d.chargeDetail) TEL.chargeDetail = d.chargeDetail;
    if(d.chargeControl) TEL.chargeControl = d.chargeControl;
    if(d.windows) TEL.windows = d.windows;
    if(d.cycles) TEL.cycles = d.cycles;
    if(d.places) TEL.places = d.places;
    if(d.merge) TEL.merge = d.merge;
    if(d.gauges) TEL.gauges = d.gauges;
    if(d.storage) TEL.storageBytes = d.storage.bytes;
    if(d.roadcast){
      TEL.roadcast = d.roadcast;
      if(d.roadcast.running) rcSt = rcSt === 'unchecked' ? 'unchecked' : rcSt;
    }
    if(d.settings && TEL.native){
      /* projectionBetaEnabled здесь НЕ применяется: 1-Гц эхо движка стомпило
         локальный тумблер (гонка со старым значением сразу после клика).
         Источник истины для SET.proj — appState() при загрузке + сам клик. */
      var m = {autoStart:'auto', gpsEnabled:'gps', continuousModeEnabled:'cont',
               debugEventFileEnabled:'evf', externalChargeControlEnabled:'ext',
               replaceOemChargingEnabled:'roem'};
      for (var k in m) if (k in d.settings) SET[m[k]] = !!d.settings[k];
    }
    /* Stage T2: окна/спаны/настройки — в контроллер монитора энергии;
       вкладка «Поездки» перерисовывается сама (repaintLive), без полной
       пересборки, чтобы анимация графика не рвалась. */
    telHomePaint(); telBodyPaint();
  });

  /* Stage B5: живой поток телеметрии — порт канала
     com.timhss.capyenergy/telemetry/live (LiveTelemetryPublisher движка).
     Правила потребления — как у capy: LiveTripVhalReadings.merge
     (поля, которых кадр не принёс, держат прошлое значение; качество
     UNAVAILABLE/ERROR — значение непригодно) и перерисовка на каденции
     ЭКРАНА (1 Гц), а не на каденции сэмплов. */
  var TEL_LIVE = { lastFrame: 0 };
  var TEL_UNUSABLE = { UNAVAILABLE: 1, ERROR: 1 };
  var telLiveRender = 0;
  var telLiveTimer = 0;
  /* отладка/тесты: состояние живого потока снаружи IIFE */
  window.TEL_LIVE = TEL_LIVE;
  function telLiveSig(d, sid){
    if(!d || !d.signals) return null;
    for(var i = 0; i < d.signals.length; i++){
      var s = d.signals[i];
      if(s.signalId !== sid) continue;
      if(s.quality && TEL_UNUSABLE[String(s.quality).toUpperCase()]) return null;
      var v = s.value;
      return (v != null && isFinite(+v)) ? +v : null;
    }
    return null;
  }
  /* Stage B6: карточка батареи в шелле — реальные данные движка.
     Демо-режим макета (78% / симуляция зарядки) не трогаем: он остаётся
     фолбэком для браузера. */
  function telHomePaint(){
    var bn = document.getElementById('battNum'), rf = document.getElementById('rngNum'),
        fl = document.getElementById('battFill'), bar = document.getElementById('battBar'),
        cs = document.getElementById('chgStatus'), pl = document.querySelector('.battPct small');
    if(!bn || !TEL.native) return;
    var rg = TEL.range || {};
    var soc = (TEL_LIVE.soc != null) ? TEL_LIVE.soc : (rg.soc != null ? rg.soc : null);
    if(soc == null){
      if(fl) fl.style.width = '0%';
      bn.textContent = '\u2014%';
      if(rf) rf.textContent = '\u2014';
      if(bar) bar.classList.remove('charging');
      if(cs) cs.textContent = 'Нет данных автомобиля';
      if(pl) pl.textContent = 'батарея';
      return;
    }
    var s = Math.max(0, Math.min(100, Math.round(soc)));
    if(fl) fl.style.width = s + '%';
    bn.textContent = s + '%';
    if(rf) rf.textContent = (rg.carKm != null) ? Math.round(rg.carKm) : '\u2014';
    var set = TEL.set || {}, lim = (set.chargeTargetSoc != null) ? set.chargeTargetSoc : null;
    if(pl) pl.textContent = lim != null ? ('\u0431\u0430\u0442\u0430\u0440\u0435\u044f \u00b7 \u043b\u0438\u043c\u0438\u0442 ' + lim + '%') : '\u0431\u0430\u0442\u0430\u0440\u0435\u044f';
    var st = TEL.status || {};
    if(st.chargeState === 'ACTIVE'){
      var p = null;
      if(TEL_LIVE.dcPowerKw != null && TEL_LIVE.dcPowerKw > 0) p = TEL_LIVE.dcPowerKw;
      else if(TEL_LIVE.vhalPowerKw != null) p = Math.abs(TEL_LIVE.vhalPowerKw);
      else if(TEL_LIVE.packPowerKw != null) p = Math.abs(TEL_LIVE.packPowerKw);
      var min = null;
      if(TEL_LIVE.chargeEtaMin != null && TEL_LIVE.chargeEtaMin > 0) min = Math.round(TEL_LIVE.chargeEtaMin);
      else if(p != null && p > 0.2 && set.packWh){
        var target = (lim != null) ? lim : 100;
        if(target > soc) min = Math.round((target - soc) / 100 * (set.packWh / 1000) / p * 60);
      }
      if(bar) bar.classList.add('charging');
      if(cs) cs.innerHTML = '\u0417\u0430\u0440\u044f\u0434\u043a\u0430' + (p != null ? ' \u00b7 ' + telNum(p, 1) + ' \u043a\u0412\u0442' : '') +
        (min != null ? ' \u00b7 <b>\u2248 ' + min + ' \u043c\u0438\u043d</b>' : '');
    } else {
      if(bar) bar.classList.remove('charging');
      if(cs) cs.textContent = TEL_LIVE.plugConnected ? '\u041f\u043e\u0434\u043a\u043b\u044e\u0447\u0435\u043d\u0430 \u00b7 \u043d\u0435 \u0437\u0430\u0440\u044f\u0436\u0430\u0435\u0442\u0441\u044f' : '\u041d\u0435 \u0437\u0430\u0440\u044f\u0436\u0430\u0435\u0442\u0441\u044f';
    }
  }

  /* Stage B6: кузов (капот/багажник/замок) из сигналов движка.
     Порог открытости — ненулевое значение сигнала положения;
     семантика счётчиков подтверждается на живой машине (адаптация
     задокументирована). Без данных — честное «нет данных». */
  function telBodyPaint(){
    if(!TEL.native) return;
    var h = document.getElementById('coHood'), t = document.getElementById('coTrunk'),
        l = document.getElementById('coLock');
    if(h){
      if(TEL_LIVE.hood != null){
        var open = TEL_LIVE.hood !== 0;
        h.classList.toggle('open', open);
        h.querySelector('b').textContent = open ? '\u043e\u0442\u043a\u0440\u044b\u0442' : '\u0437\u0430\u043a\u0440\u044b\u0442';
      } else { h.classList.remove('open'); h.querySelector('b').textContent = '\u043d\u0435\u0442 \u0434\u0430\u043d\u043d\u044b\u0445'; }
    }
    if(t){
      if(TEL_LIVE.trunk != null){
        var to = TEL_LIVE.trunk !== 0;
        t.classList.toggle('open', to);
        t.querySelector('b').textContent = to ? '\u043e\u0442\u043a\u0440\u044b\u0442' : '\u0437\u0430\u043a\u0440\u044b\u0442';
      } else { t.classList.remove('open'); t.querySelector('b').textContent = '\u043d\u0435\u0442 \u0434\u0430\u043d\u043d\u044b\u0445'; }
    }
    if(l && TEL_LIVE.lockFeedback != null)
      l.textContent = TEL_LIVE.lockFeedback !== 0 ? '\uD83D\uDD12' : '\uD83D\uDD13';
  }

  window.addEventListener('native:telemetry.live', function(ev){
    var d = ev && ev.detail; if(!d) return;
    TEL.native = true;
    TEL_LIVE.lastFrame = d.timestampMillis || Date.now();
    var g = TEL.gauges || (TEL.gauges = {});
    var v;
    /* merge полей (порт LiveTripVhalReadings) */
    v = telLiveSig(d, 'VEHICLE_SPEED');   if(v != null){ TEL_LIVE.speedKmh = v; g.speedKmh = v; }
    v = telLiveSig(d, 'HV_BATTERY_SOC');  if(v != null){ TEL_LIVE.soc = v; var rg = TEL.range || (TEL.range = {}); rg.soc = v; }
    v = telLiveSig(d, 'ODOMETER');        if(v != null) TEL_LIVE.odometerKm = v;
    v = telLiveSig(d, 'ROAD_INCLINE');    if(v != null) g.gradient = v;
    v = telLiveSig(d, 'HV_BATTERY_VOLTAGE'); if(v != null) TEL_LIVE.packVoltageV = v;
    v = telLiveSig(d, 'HV_BATTERY_CURRENT'); if(v != null) TEL_LIVE.packCurrentA = v;
    v = telLiveSig(d, 'EV_BATTERY_INSTANTANEOUS_POWER'); if(v != null) TEL_LIVE.vhalPowerKw = v;
    if(TEL_LIVE.packVoltageV != null && TEL_LIVE.packCurrentA != null)
      TEL_LIVE.packPowerKw = TEL_LIVE.packVoltageV * TEL_LIVE.packCurrentA / 1000;
    /* Stage B6: зарядка и кузов (merge, как у capy) */
    v = telLiveSig(d, 'EV_DC_CHARGE_POWER');       if(v != null) TEL_LIVE.dcPowerKw = v;
    v = telLiveSig(d, 'EV_CHARGE_ESTIMATED_TIME'); if(v != null) TEL_LIVE.chargeEtaMin = v;
    v = telLiveSig(d, 'EV_CHARGE_PORT_CONNECTED'); if(v != null) TEL_LIVE.plugConnected = v !== 0;
    v = telLiveSig(d, 'ROAD_INCLINE'); if(v != null){ TEL.gauges = TEL.gauges || {}; TEL.gauges.gradient = v; }
    v = telLiveSig(d, 'BCM_HOOD_STATUS');          if(v != null) TEL_LIVE.hood = v;
    v = telLiveSig(d, 'BODY_DOOR_TRUNK_DOOR_POS'); if(v != null) TEL_LIVE.trunk = v;
    v = telLiveSig(d, 'VEHIC_RKE_LOCK_FEEDBACK');  if(v != null) TEL_LIVE.lockFeedback = v;
    /* статус сборщика (CollectorStatus) — merge */
    if(d.status){
      var s = d.status, st = TEL.status || (TEL.status = {});
      if(s.running != null) st.running = s.running;
      if(s.collectorStatus) st.collectorStatus = s.collectorStatus;
      if(s.vehicleActivity) st.activity = s.vehicleActivity;
      if(s.tripState) st.tripState = s.tripState;
      if(s.chargeState) st.chargeState = s.chargeState;
      if(s.signalCount != null) st.signals = s.signalCount;
      if(s.lastUpdateMillis) st.lastUpdate = s.lastUpdateMillis;
    }
    /* лёгкие поля Roadcast */
    if(d.roadcast){
      var rc = d.roadcast, tr = TEL.roadcast || (TEL.roadcast = {});
      if(rc.signalCount != null) tr.signalCount = rc.signalCount;
      if(rc.frameCount != null) tr.frameCount = rc.frameCount;
      if(rc.hz != null) tr.hz = rc.hz;
    }
    /* перерисовка на каденции экрана (1 Гц): карточка батареи и кузов —
       на любой вкладке (шелл), контент — только вкладка телеметрии,
       настройки ⚙ не перерисовываем. Кадр, пришедший внутри окна
       троттлинга, не теряется: отстающий рендер красит последнее
       состояние на границе секунды (аналог paint-on-cadence у capy). */
    var now = Date.now();
    if(now - telLiveRender >= 1000){
      telLiveRender = now;
      telLivePaintAll();
    } else if(!telLiveTimer){
      telLiveTimer = setTimeout(function(){
        telLiveTimer = 0;
        telLiveRender = Date.now();
        telLivePaintAll();
      }, 1000 - (now - telLiveRender));
    }
  });
  function telLivePaintAll(){
    telHomePaint(); telBodyPaint();
    /* Stage T2: «Поездки» (telTab 0) перерисовывается сама через TMON —
       полный render рвал бы анимацию столбцов каждую секунду. */
    if(typeof curId !== 'undefined' && curId === 'telemetry' && telTab !== 4 && telTab !== 0 && telTab !== 1 && telTab !== 2){
      var sc = content.scrollTop; render('telemetry'); content.scrollTop = sc;
    }
  }

  /* GeelyTools deviation: слушатели telemetry.{energyLive,energyWindow,
     sessionSeries,cycleSessions,chargeState,actionDone,storage} удалены —
     их экраны живут во Flutter-приложении телеметрии. */

  /* Stage T5: вкладка «Синхронизация» удалена — telemetry.syncDone больше
     не слушается (sync.now из UI не отправляется). */

  /* Авто-открытие вкладки «Зарядка» (extra "destination" из AutoOpenLauncher) */
  /* ── Stage VO: вызов голосового помощника — анимация «точь-в-точь как в макете» ──
     События из VoiceAssistantService (voice.ui): listen → оранжевый микрофон с кольцами,
     «Слушаю…», эквалайзер; status → промежуточный текст; result → «Жду обращения» + карточка
     с фразой и ответом; idle → сброс. Ровно те же элементы, что в voiceDemo панели «Голос». */
  window.addEventListener('native:voice.ui', function(ev){
    var d=(ev&&ev.detail)||{};
    var els=function(){return{mb:document.getElementById('micBtn'),st:document.getElementById('voiceState'),eq:document.getElementById('voiceEq'),rs:document.getElementById('voiceResp')}};
    if(d.phase==='listen'){
      var e=els();
      if(!e.mb)return;/* сервис шлёт voice.ui только когда вкладка «Голос» на экране */
      if(e.mb){e.mb.classList.add('live');e.st.textContent='Слушаю…';e.eq.classList.add('on');e.rs.classList.remove('on')}
    }else if(d.phase==='status'){
      var e2=els();
      if(e2.st&&e2.mb&&d.text){
        var t=String(d.text);
        if(!t.trim()||t==='Привет'||t==='Слушаю...'||t==='Слушаю…')t='Слушаю…';
        e2.st.textContent=t;
        if(!e2.mb.classList.contains('live')){e2.mb.classList.add('live');e2.eq.classList.add('on')}
      }
    }else if(d.phase==='result'){
      var e3=els();
      if(e3.mb){e3.mb.classList.remove('live');e3.eq.classList.remove('on');e3.st.textContent='Жду обращения'}
      if(e3.rs&&d.phrase){e3.rs.innerHTML='<b>«'+d.phrase+'»</b><small>'+(d.reply||'')+'</small>';e3.rs.classList.add('on')}
    }else if(d.phase==='idle'){
      var e4=els();
      if(e4.mb){e4.mb.classList.remove('live');e4.eq.classList.remove('on');if(e4.st)e4.st.textContent='Жду обращения'}
    }
  });

  /* Stage UPD: состояние обновления из AppUpdater (check/download/install) */
  window.addEventListener('native:update.state', function(ev){
    var d=(ev&&ev.detail)||{};
    if(d.phase)UPD.state=d.phase;
    if(d.current)UPD.cur=d.current;
    if(d.version)UPD.ver=d.version;
    if(d.changelog!=null)UPD.notes=String(d.changelog);
    if(d.percent!=null)UPD.pct=d.percent;
    if(d.message!=null)UPD.msg=d.message;
    if(UPD.state==='available'){UPD.pct=0;say('Доступна версия v'+UPD.ver)}
    else if(UPD.state==='error'){say(UPD.msg||'Ошибка обновления')}
    updPaint();
  });

  window.addEventListener('native:ui.destination', function(ev){
    var d = ((ev && ev.detail) || {}).destination || '';
    if (d.indexOf('charg') >= 0 || d === 'charging') {
      /* GeelyTools deviation: экран зарядки — во Flutter-приложении телеметрии */
      if (window.__geelyEmit) window.__geelyEmit('telemetry.open', {destination:'charging'});
    } else if (d === 'carplay' || d === 'androidAuto') {
      /* ProjectionAutoOpenSupervisor: цель открывается сразу, если вкладка
         уже показана, иначе держится до её появления (AppNavigationController:
         «a held destination is not dropped when its tab is not (yet) shown»). */
      var id = d === 'carplay' ? 'carplay' : 'aa';
      if (document.querySelector('.tab[data-id="' + id + '"]')) select(id);
      else PENDING_DEST = d;
    }
  });

  /* CarPlay/AA: снимок присутствия из Kotlin (ProjectionPresenceMonitor →
     projection.presence; структуры — ProjectionPresenceSnapshot.toMap).
     Как applyPresence в AppShellV2: вкладки решает resolveProjectionTabs,
     вкладка прибывшего телефона открывается сама — но только по переходу
     disconnected→connected, не по первому прочитанному значению. */
  window.addEventListener('native:projection.presence', function(ev){
    var d = (ev && ev.detail) || {};
    var prev = { carplay: PROJ.carplay, androidAuto: PROJ.androidAuto };
    if ('carplay' in d) PROJ.carplay = d.carplay;
    if ('androidAuto' in d) PROJ.androidAuto = d.androidAuto;
    if ('carplayEdgeAt' in d) PROJ.cpAt = (d.carplayEdgeAt == null) ? null : +d.carplayEdgeAt;
    if ('androidAutoEdgeAt' in d) PROJ.aaAt = (d.androidAutoEdgeAt == null) ? null : +d.androidAutoEdgeAt;
    if ('carplayAvailable' in d) PROJ.cpAvail = !!d.carplayAvailable;
    if ('androidAutoAvailable' in d) PROJ.aaAvail = !!d.androidAutoAvailable;
    var arrived = arrivedTab(prev, PROJ);
    applyProjection();
    if (arrived && SET.proj) select(arrived);
  });

  /* Stage CPv2: статусы рендер-мостов (CarplayStatus/AndroidAutoStatus.toMap
     из Kotlin). Четыре состояния сообщения — порт _message() из
     carplay_v2_screen.dart; когда рендер идёт, сообщения нет — нативный
     TextureView закрывает область, и redraw под ним ничего не рвёт
     (активация идёт по ребру, syncProjectionConfiguration — no-op). */
  window.addEventListener('native:carplay.status', function(ev){
    projApplyStatus('carplay', (ev && ev.detail) || {});
  });
  window.addEventListener('native:android_auto.status', function(ev){
    projApplyStatus('androidAuto', (ev && ev.detail) || {});
  });

  /* Stage CPv2: рамка видео пересчитывается при ресайзе окна и прокрутке
     контента — нативный TextureView должен стоять ровно по прямоугольнику. */
  window.addEventListener('resize', function(){ if (ACTIVE_STACK) reportProjectionFrame(); });
  document.getElementById('content').addEventListener('scroll', function(){
    if (ACTIVE_STACK) reportProjectionFrame();
  }, { passive: true });

  /* Готово: сообщаем нативной стороне и показываем реальную версию APK */
  window.addEventListener('load', function(){
    if(N){
      try{
        var c = document.querySelector('.conn span');
        if(c) c.textContent = '\u00B7 EX2 v' + N.appVersion();
      }catch(e){}
      /* Stage SCR: настройки приложения из persistence (тумблеры «Полный экран»
         и «Запуск при пробуждении») — до того, как экраны их нарисуют */
      try{
        if(N.appState){
          var st = JSON.parse(N.appState());
          if(st && ('imm' in st)){ SET.imm = !!st.imm; }
          if(st && ('wake' in st)) SET.wake = !!st.wake;
          /* Тумблер CarPlay/AA — как imm/wake: читается из persistence при
             каждой загрузке страницы, не ждёт потока телеметрии. */
          if(st && ('proj' in st)){ SET.proj = !!st.proj; applyProjection(); }
          /* Stage CXT: один снимок из реестра настроек (imm/wake/cb/proj/
             follow/gu/theme) — шелл больше не хранит свои значения. */
          toolsApplyState(st);
        }
      }catch(e){}
    }
    emit('ui.ready', {});
    emit('telemetry.request', {});
  });
})();



/* ── Модальное окно управления Keep-Alive приложениями ── */
window.__keepAliveModalList = [];
window.__onKeepAliveApps = function(apps){
  window.__keepAliveModalList = apps || [];
  cxRenderKeepAliveList();
};

function cxOpenKeepAliveModal(){
  var h = '<div class="mBack" onclick="if(event.target===this)closeModal()">'
    + '<div class="mCard" style="max-width:540px;width:90%;max-height:80vh;display:flex;flex-direction:column;position:relative;z-index:99999;">'
    + '<div class="mTitle" style="margin-bottom:12px;">Всегда активные приложения</div>'
    + '<div style="font-size:14px;color:var(--cx-muted,#666);margin-bottom:14px;">Отметьте приложения, которые система не должна выгружать из памяти при работе в фоне:</div>'
    + '<div id="__keep_alive_list_container" style="flex:1;overflow-y:auto;padding-right:6px;max-height:360px;">'
    + '<div style="text-align:center;padding:24px;color:var(--cx-muted,#888);">Загрузка списка приложений...</div>'
    + '</div>'
    + '<div class="btnrow" style="margin-top:16px;display:flex;gap:12px;">'
    + '<button class="tileBtn c" style="flex:1" onclick="closeModal()"><span>ОТМЕНА</span></button>'
    + '<button class="tileBtn" style="flex:1;background:var(--cx-accent,#18963E);color:#fff;" onclick="cxSaveKeepAliveModal()"><span>СОХРАНИТЬ</span></button>'
    + '</div></div></div>';
  mRoot().innerHTML = h;
  if(window.__geelyEmit){
    window.__geelyEmit('perf.getKeepAliveList', {});
  } else {
    // В эмуляторе/тестовом окружении
    setTimeout(function(){
      window.__onKeepAliveApps([
        {label: "Spotify", packageName: "com.spotify.music", enabled: true},
        {label: "Яндекс.Музыка", packageName: "ru.yandex.music", enabled: true},
        {label: "Яндекс.Навигатор", packageName: "ru.yandex.yandexnavi", enabled: true},
        {label: "YouTube Music", packageName: "com.google.android.apps.youtube.music", enabled: false},
        {label: "2ГИС", packageName: "ru.dublgis.dgismobile", enabled: false}
      ]);
    }, 150);
  }
}

function cxRenderKeepAliveList(){
  var c = el('__keep_alive_list_container');
  if(!c) return;
  var apps = window.__keepAliveModalList;
  if(!apps || !apps.length){
    c.innerHTML = '<div style="text-align:center;padding:24px;color:var(--cx-muted,#888);">Нет доступных приложений</div>';
    return;
  }
  var h = '';
  apps.forEach(function(a, idx){
    h += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--cx-divider,rgba(0,0,0,0.06));">'
      + '<div style="flex:1;padding-right:12px;">'
      + '<div style="font-size:16px;font-weight:600;color:var(--cx-text,#111);">' + a.label + '</div>'
      + '<div style="font-size:12px;color:var(--cx-muted,#888);">' + a.packageName + '</div>'
      + '</div>'
      + '<input type="checkbox" id="__ka_chk_' + idx + '" ' + (a.enabled ? 'checked' : '') + ' style="width:22px;height:22px;accent-color:var(--cx-accent,#18963E);cursor:pointer;" onchange="window.__keepAliveModalList[' + idx + '].enabled=this.checked">'
      + '</div>';
  });
  c.innerHTML = h;
}

function cxSaveKeepAliveModal(){
  var selected = [];
  (window.__keepAliveModalList || []).forEach(function(a){
    if(a.enabled) selected.push(a.packageName);
  });
  if(window.__geelyEmit){
    window.__geelyEmit('perf.saveKeepAlive', {packages: selected});
  }
  closeModal();
}




window.cxDevRunCmd = function(){
  var inp = el('__dev_cmd_input');
  if(!inp || !inp.value.trim()) return;
  var cmd = inp.value.trim();
  var out = el('__dev_cmd_output');
  if(out) out.textContent = 'Выполняется: ' + cmd + '...';
  if(window.__geelyEmit){
    window.__geelyEmit('dev.runCommand', {command: cmd});
  }
};

window.cxDevQuickCmd = function(cmd){
  var inp = el('__dev_cmd_input');
  if(inp) inp.value = cmd;
  cxDevRunCmd();
};

window.cxDevReadLogs = function(){
  var logOut = el('__dev_log_output');
  if(logOut) logOut.textContent = 'Чтение logcat...';
  if(window.__geelyEmit){
    window.__geelyEmit('dev.getLogcat', {});
  }
};

window.cxDevClearLogs = function(){
  var logOut = el('__dev_log_output');
  if(logOut) logOut.textContent = 'Журнал очищен.';
};

window.__onDevCmdResult = function(res){
  var out = el('__dev_cmd_output');
  if(out){
    out.textContent = (res && res.output) || 'Команда выполнена (вывод пуст, exitCode=' + ((res && res.exitCode) || 0) + ')';
  }
};

window.__onDevLogcatResult = function(logs){
  var logOut = el('__dev_log_output');
  if(logOut){
    logOut.textContent = logs || 'Логи отсутствуют';
  }
};
