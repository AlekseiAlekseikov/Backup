<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geely EX2 ГУ — концепт в стиле Zeekr</title>
<style>
:root{--page1:#F3EEE3;--page2:#E6DECD;--card:#FFFDF8;--card2:#F5F0E5;--ink:#1A1A1A;--muted:#8A8175;--muted2:#A79E8C;--line:#E9E2D2;--track:#EEE7D6;--btn:#1A1A1A;--onbtn:#fff;--sel:#fff;--onsel:#1A1A1A;--barbg:rgba(255,253,248,.94)}
body[data-th="0"]{--page1:#EFEFED;--page2:#DFDFDD;--card:#FFFFFF;--card2:#EBEBEB;--ink:#0D0D0D;--muted:#6B6B6B;--muted2:#9A9A9A;--line:#DEDEDC;--track:#E3E3E1;--btn:#262626;--onbtn:#FFFFFF;--sel:#FFFFFF;--onsel:#0D0D0D;--barbg:rgba(255,255,255,.94)}
body[data-th="1"]{--page1:#17323E;--page2:#0E222B;--card:#294854;--card2:#3A5964;--ink:#F7F7F0;--muted:#D2DDDA;--muted2:#9EB2B1;--line:#466570;--track:#3A5964;--btn:#D7E8E5;--onbtn:#17313B;--sel:#D7E8E5;--onsel:#17313B;--barbg:rgba(41,72,84,.94)}
body[data-th="2"]{--page1:#0A0A0A;--page2:#000000;--card:#151515;--card2:#232323;--ink:#F2F2F2;--muted:#AFAFAF;--muted2:#7A7A7A;--line:#2C2C2C;--track:#2A2A2A;--btn:#E8E8E8;--onbtn:#0A0A0A;--sel:#E8E8E8;--onsel:#0A0A0A;--barbg:rgba(21,21,21,.94)}
body[data-th="3"]{--page1:#F0E9DC;--page2:#E0D3BA;--card:#FBF6EC;--card2:#E9E0CF;--ink:#231C0F;--muted:#6E6353;--muted2:#9C9081;--line:#D8CCB4;--track:#E4DACA;--btn:#3A2F1E;--onbtn:#FBF6EC;--sel:#FFFFFF;--onsel:#231C0F;--barbg:rgba(251,246,236,.94)}
body[data-th="4"]{--page1:#20242C;--page2:#14171D;--card:#2C323C;--card2:#3A414D;--ink:#E7ECF3;--muted:#B6BFCD;--muted2:#8792A3;--line:#434B58;--track:#3A414D;--btn:#D5DEEB;--onbtn:#20242C;--sel:#D5DEEB;--onsel:#20242C;--barbg:rgba(44,50,60,.94)}
body[data-th="5"]{--page1:#FFFFFF;--page2:#E4E4E4;--card:#FFFFFF;--card2:#E2E2E2;--ink:#000000;--muted:#3D3D3D;--muted2:#5E5E5E;--line:#3A3A3A;--track:#D8D8D8;--btn:#000000;--onbtn:#FFFFFF;--sel:#FFFFFF;--onsel:#000000;--barbg:rgba(255,255,255,.96)}
body[data-th="6"]{--page1:#0B0714;--page2:#05030B;--card:#150E24;--card2:#221838;--ink:#F2ECFF;--muted:#B9A8E0;--muted2:#7E6BA8;--line:#2B2043;--track:#251A3C;--btn:#E9DDFF;--onbtn:#150E24;--sel:#E9DDFF;--onsel:#150E24;--barbg:rgba(21,14,36,.94)}
body[data-th="7"]{--page1:#1B0F1C;--page2:#120812;--card:#2A1728;--card2:#3A2036;--ink:#FFEDE4;--muted:#E0B9AE;--muted2:#A9807C;--line:#3E2238;--track:#3E2238;--btn:#FFE0CF;--onbtn:#2A1728;--sel:#FFE0CF;--onsel:#2A1728;--barbg:rgba(42,23,40,.94)}
body[data-th="8"]{--page1:#FDF2FA;--page2:#F0D6E8;--card:#FFFFFF;--card2:#F7E4F3;--ink:#2B1030;--muted:#7A5478;--muted2:#A889A6;--line:#EBD0E6;--track:#F3DCEE;--btn:#3D1642;--onbtn:#FFF5FC;--sel:#FFFFFF;--onsel:#2B1030;--barbg:rgba(255,255,255,.94)}
.projView{position:relative;background:#0B0E12;border-radius:20px;margin-top:12px;min-height:320px;overflow:hidden}
/* Stage CPv4: projection full-bleed — поверхность строго во весь экран
   (без шапки, карточки, скруглений и отступов); видимой остаётся только
   плавающая панель. Низ контейнера задаёт JS по верхней кромке .tabbar. */
body.projfull .topbar{display:none}
body.projfull .projView{position:fixed;left:0;top:0;width:100vw;margin:0;border-radius:0;min-height:0;z-index:30}
.projMsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#98A0AC;text-align:center;padding:24px}
.projMsg .pBig{font-size:44px;line-height:1}
.projMsg b{font-size:16px;color:#E8EBEF;font-weight:800}
.projMsg small{font-size:12.5px;color:#7B8390;max-width:420px}
.projDiag{position:absolute;left:14px;bottom:14px;display:flex;gap:10px;align-items:center;background:rgba(15,18,23,.78);color:#A9B0BA;border-radius:12px;padding:7px 12px;font-size:12px;font-variant-numeric:tabular-nums}
.projDiag button{border:0;border-radius:9px;background:#2A313B;color:#DDE2E8;padding:6px 12px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
.phome{width:110px;height:5px;border-radius:3px;background:rgba(255,255,255,.5);margin:10px auto 2px}
#climBar{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:rgba(26,26,26,.92);color:#fff;border-radius:100px;padding:8px 20px;display:flex;gap:12px;align-items:center;font-size:13px;font-weight:700;z-index:39;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#climBar b{font-size:16px;font-variant-numeric:tabular-nums}
#climBar span{opacity:.6;font-weight:600;font-size:12px}
#climBar i{font-style:normal;background:rgba(255,255,255,.16);padding:3px 12px;border-radius:100px;font-size:12px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;background:linear-gradient(180deg,var(--page1) 0%,var(--page2) 100%);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden;user-select:none}
/* ===== TOP BAR ===== */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 22px 8px;flex-shrink:0}
.carTitle{font-size:19px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
.badgeP{background:var(--btn);color:var(--onbtn);font-size:12px;font-weight:800;padding:3px 10px;border-radius:8px;letter-spacing:1px}
.parked{font-size:13px;color:var(--muted);font-weight:500}
.topRight{margin-left:auto;display:flex;align-items:center;gap:12px}
.clock{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.outTemp{font-size:14px;color:var(--muted);font-weight:600}
.conn{display:flex;align-items:center;gap:7px;background:var(--card);padding:7px 14px;border-radius:100px;font-size:12.5px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.conn i{width:8px;height:8px;border-radius:50%;background:#34C759}
.conn span{color:var(--muted);font-weight:500}
/* ===== MAIN ===== */
.main{flex:1;display:grid;grid-template-columns:minmax(380px,1fr) minmax(460px,1.35fr);gap:12px;padding:2px 22px 86px;min-height:0;transition:grid-template-columns .55s cubic-bezier(.32,.72,0,1),gap .55s}
/* ===== CAR CARD ===== */
.card{background:var(--card);border-radius:22px;box-shadow:0 4px 20px rgba(120,100,70,.09);display:flex;flex-direction:column;min-height:0}
.carCard{padding:16px 18px 14px}
.eyebrow{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase}
.rangeRow{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.bignum{font-size:52px;font-weight:700;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{font-size:17px;font-weight:500;color:var(--muted);letter-spacing:0}
.battPct{margin-left:auto;text-align:right}
.battPct b{font-size:24px;font-variant-numeric:tabular-nums}
.battPct small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.carWrap{flex:1;display:flex;align-items:flex-start;justify-content:center;min-height:0;position:relative}
.carWrap img{width:100%;max-height:100%;object-fit:contain;transition:opacity .25s}
.bar{height:9px;background:var(--track);border-radius:100px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:78%;background:linear-gradient(90deg,#2FD35F,#1FB34E);border-radius:100px}
.statusline{margin-top:8px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.statusline b{color:var(--ink)}
.colors{display:flex;align-items:center;gap:9px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.colors .clabel{font-size:12.5px;font-weight:700}
.colors .cname{font-size:12px;color:var(--muted);font-weight:500}
.dot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.12);transition:.18s;flex-shrink:0}
.dot:hover{transform:scale(1.12)}
.dot.sel{box-shadow:0 0 0 2px var(--card),0 0 0 4.5px #E86A33}
/* ===== CONTENT ===== */
.contentCard{padding:18px 20px;overflow-y:auto}
/* Stage CXT: на «Инструментах» карточка шелла играет роль MasterContentRoot CentralEXAuto —
   отступы 36/54dp (master_content_padding_*), фон master_window, скролл у самих панелей. */
.contentCard.cxmode{padding:26px 30px;overflow:hidden;color:var(--cx-text)}
.contentCard h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.contentCard .csub{font-size:13px;color:var(--muted);margin:2px 0 4px}
.sect{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;margin:15px 0 8px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border:0;background:var(--card2);border-radius:15px;padding:12px 4px;text-align:center;cursor:pointer;transition:.15s;font-family:inherit;color:var(--ink)}
.mode span{font-size:23px;display:block;margin-bottom:5px}
.mode b{font-size:13.5px;display:block}.mode small{font-size:11px;color:var(--muted);font-weight:500}
.mode.sel{background:var(--btn);color:var(--onbtn)}.mode.sel small{color:var(--onbtn);opacity:.7}
.seg{display:flex;background:var(--card2);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 2px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.seg button.sel{background:var(--sel);color:var(--onsel);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600}
.row:last-child{border-bottom:0}
.row small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.sw{position:relative;width:50px;height:30px;flex-shrink:0;cursor:pointer}
.sw input{opacity:0;width:0;height:0}
.sw u{position:absolute;inset:0;background:var(--track);border-radius:100px;transition:.2s;text-decoration:none}
.sw u:before{content:'';position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.22)}
.sw input:checked+u{background:#34C759}
.sw input:checked+u:before{transform:translateX(20px)}
.sld{flex:1;display:flex;align-items:center;gap:10px;min-width:170px}
.sld input[type=range]{flex:1;appearance:none;-webkit-appearance:none;height:6px;border-radius:100px;background:var(--line);outline:none}
.sld input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;border:5px solid var(--ink)}
.sld b{font-size:14px;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.btn{border:0;background:var(--btn);color:var(--onbtn);padding:11px 24px;border-radius:100px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btnrow{display:flex;gap:8px;margin-top:12px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.pIco{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.aa{background:#E7F4E4}.cp{background:var(--btn);color:var(--onbtn)}
.prow b{font-size:14.5px;display:block}.prow small{font-size:12px;color:var(--muted)}
.prow small.red{color:#E8533B}
.go{margin-left:auto;border:0;background:var(--btn);color:var(--onbtn);padding:9px 22px;border-radius:100px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;flex-shrink:0}
.go:active{transform:scale(.94)}
.mapbox{border-radius:15px;overflow:hidden;position:relative;background:#ECE5D4;margin-top:4px}
.mapbox svg{display:block;width:100%;height:auto}
.mapTag{position:absolute;left:10px;bottom:10px;background:var(--card);border-radius:11px;padding:7px 12px;font-size:12.5px;font-weight:700}
.mapTag small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}.kv b{font-variant-numeric:tabular-nums}
.verCard{background:var(--card2);border-radius:15px;padding:14px 16px;display:flex;align-items:center;gap:13px;margin-top:4px}
.verCard .vIco{width:44px;height:44px;border-radius:13px;background:var(--btn);color:var(--onbtn);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.verCard b{font-size:15px;display:block}.verCard small{font-size:12px;color:#34C759;font-weight:700}
/* ===== FLOATING MENU ===== */
.tabbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);background:var(--barbg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:100px;box-shadow:0 10px 34px rgba(120,100,70,.25);display:flex;padding:7px;gap:2px;z-index:40;overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 11px;border-radius:100px;font-size:12.5px;font-weight:700;color:var(--muted2);cursor:pointer;display:flex;align-items:center;gap:7px;font-family:inherit;transition:.2s;white-space:nowrap;flex-shrink:0}
.tab span{font-size:17px}
.tab.sel{background:var(--btn);color:var(--onbtn)}
/* callouts + climate + charging */
.callouts{display:flex;justify-content:space-between;align-items:flex-start;padding:0 10px;margin-top:8px}
.co{border:0;background:transparent;padding:4px 10px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.co span{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted2)}
.co b{font-size:13px;font-weight:800;color:var(--ink);margin-top:2px}
.co i{display:block;width:1.5px;height:46px;background:var(--line);margin-top:8px}
.co.open b{color:#E86A33}
.co.open i{background:#E86A33}
.coLock{border:0;background:var(--btn);color:var(--onbtn);width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.22);font-family:inherit;position:relative}
.coLock::after{content:'';position:absolute;left:50%;top:100%;width:1.5px;height:46px;background:var(--line);margin:8px 0 0 -.75px}
.airGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.air,.heat,.seat{border:0;background:var(--card2);border-radius:15px;padding:11px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:inherit;color:var(--ink);transition:.15s}
.air svg,.heat svg,.seat svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.air b,.heat b,.seat b{font-size:12px;font-weight:700}
.air.sel{background:var(--btn);color:var(--onbtn)}
.heat.on{background:#E86A33;color:#fff}
.seat.on{box-shadow:inset 0 0 0 2px #E86A33}
.lvl{display:flex;gap:3px}
.lvl s{width:15px;height:4px;border-radius:2px;background:var(--line)}
.lvl s.f{background:#E86A33}
.notes{background:var(--card2);border-radius:15px;padding:4px 16px;margin-top:4px}
.notes div{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700}
.notes div:last-child{border-bottom:0}
.notes small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:1px}
.updProg{margin-top:12px}
.updTop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.updTop b{font-size:26px;font-variant-numeric:tabular-nums}
.updTop span{font-size:13px;color:var(--muted);font-weight:600}
.ubar{height:12px;background:var(--track);border-radius:100px;overflow:hidden}
.ubar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--btn),var(--muted));border-radius:100px}
.updHint{margin-top:8px;font-size:12px;color:var(--muted)}
.bar{cursor:pointer}
.bar i{transition:width .6s}
.bar.charging i{background:repeating-linear-gradient(-55deg,#22c55e 0 14px,#6ee7a0 14px 28px);animation:chgflow 1s linear infinite,batglow 1.8s ease-in-out infinite}
@keyframes chgflow{to{background-position:-34px 0}}
@keyframes batglow{50%{box-shadow:0 0 14px rgba(34,197,94,.9)}}
/* apps + telemetry + tools + dvr */
.go.ghost{background:var(--card2);color:var(--ink)}
.go:disabled{opacity:.5}
.arow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.atico{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;color:#fff}
.arow b{font-size:14.5px;display:block}
.arow small{font-size:12px;color:var(--muted)}
.aprog{flex-basis:100%;height:6px;background:var(--track);border-radius:100px;overflow:hidden;display:none;margin-top:8px}
.arow.busy .aprog{display:block}
.aprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1FB34E,#2FD35F);border-radius:100px}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.atile{border:0;background:var(--card2);border-radius:15px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-family:inherit}
.atile .atico{width:48px;height:48px;font-size:24px}
.atile b{font-size:12px}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile{background:var(--card2);border-radius:15px;padding:12px 4px;text-align:center}
.tile small{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.tile b{display:block;font-size:19px;margin-top:4px;font-variant-numeric:tabular-nums}
.tile em{font-style:normal;font-size:11px;color:var(--muted);font-weight:600}
.spark{width:100%;height:66px;background:var(--card2);border-radius:15px;margin-top:4px}
.tirebox{background:var(--card2);border-radius:15px;padding:10px;margin-top:4px}
.tirebox svg{display:block;width:100%;height:auto}
.dvr{position:relative;border-radius:15px;overflow:hidden;margin-top:12px;background:#111}
.dvr svg{display:block;width:100%;height:auto}
.rec{position:absolute;top:10px;left:12px;display:flex;align-items:center;gap:7px;color:#fff;font-size:13px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
.rec i{width:10px;height:10px;border-radius:50%;background:#666}
.rec i.on{background:#FF3B30;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.dvrDate{position:absolute;bottom:10px;right:12px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.5)}
/* full-width content mode */
.main.full{grid-template-columns:minmax(0,0fr) minmax(0,1fr);gap:0}
/* Stage CXT fix: «Инструменты» — карточка машины НЕ скрывается, но двухпанельному
   меню нужна широкая правая колонка: сдвигаем пропорцию сетки, не трогая остальные вкладки. */
.main.cxw{grid-template-columns:minmax(380px,.8fr) minmax(460px,1.7fr)}
/* Stage NAV-MAP: вкладка «Навигация» — карта нативная и лежит ПОД WebView,
   поэтому страница делается полностью прозрачной: видим только плавающий
   док (его позиция/z-index/тень/отступы здесь же — .tabbar), само содержимое
   вкладки пустое. Прочие вкладки класс не носят и не меняются. */
body.navfull{background:transparent!important}

.carCard{min-width:0;overflow:hidden;transition:opacity .3s ease,transform .55s cubic-bezier(.32,.72,0,1)}
.main.full .carCard{opacity:0;transform:translateX(-30px) scale(.98);pointer-events:none}
/* voice */
.voiceHero{background:var(--card2);border-radius:18px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:12px;text-align:center}
.micBtn{width:84px;height:84px;border-radius:50%;border:0;background:var(--btn);color:var(--onbtn);font-size:34px;cursor:pointer;position:relative;transition:.25s;font-family:inherit}
.micBtn.live{background:#E86A33}
.micBtn.live::before,.micBtn.live::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid #E86A33;opacity:0;animation:ring 1.6s ease-out infinite}
.micBtn.live::after{animation-delay:.8s}
@keyframes ring{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.voiceHero b{font-size:18px}
.wake{font-size:13px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:6px 14px;border-radius:100px}
.eq{display:none;align-items:flex-end;gap:4px;height:26px;margin-top:4px}
.eq.on{display:flex}
.eq i{width:5px;height:30%;border-radius:3px;background:#E86A33;animation:eqb .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}
.eq i:nth-child(3){animation-delay:.3s}
.eq i:nth-child(4){animation-delay:.45s}
.eq i:nth-child(5){animation-delay:.6s}
@keyframes eqb{50%{height:100%}}
.voiceResp{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13.5px;max-width:100%}
.voiceResp.on{display:block}
.voiceResp b{font-size:14px}
.voiceResp small{display:block;color:#1FB34E;font-weight:700;margin-top:3px}
.cmdGrid{display:flex;flex-wrap:wrap;gap:8px}
.cmd{border:0;background:var(--card2);border-radius:100px;padding:10px 16px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--ink)}
.cmd:active{background:var(--line)}
/* voice catalog */
.cmdSec{border:0;width:100%;background:var(--card2);border-radius:15px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;font-family:inherit;text-align:left;margin-top:8px;color:var(--ink)}
.cmdSec b{font-size:14px;display:block}
.cmdSec small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.cmdSec .cnt{margin-left:auto;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--muted);border-radius:100px;padding:3px 10px;flex-shrink:0}
.cmdSec .arr{color:var(--line);font-size:14px;font-weight:800;transition:.2s;flex-shrink:0}
.cmdSec.open .arr{transform:rotate(90deg);color:#E86A33}
.cmdPhrases{display:flex;flex-wrap:wrap;gap:8px;padding:10px 2px 4px}
/* telemetry */
.tblk{background:var(--card2);border-radius:18px;padding:16px}
.t2col{display:grid;grid-template-columns:1.55fr 1fr;gap:10px;margin-top:12px}
.t3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.t3c{display:grid;grid-template-columns:.85fr 1.7fr 1fr;gap:10px;margin-top:12px}
.chart{width:100%;height:110px;display:block}
.tax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600;margin-top:4px}
.tstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.tstats b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.tstats em{font-style:normal;font-size:11px;color:var(--muted);font-weight:600}
.tstats small{font-size:11px;color:var(--muted);font-weight:600}
.ring{width:130px;display:block;margin:6px auto 0}
.sessT{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.bigEff{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.bigEff small{font-size:13px;color:var(--muted);font-weight:600}
.bigNum{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

.tiny{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.compass{display:flex;align-items:center;gap:10px;margin-top:4px}

.compass b{font-size:24px}
.tsearch{width:100%;border:0;background:var(--card2);border-radius:14px;padding:13px 16px;font-size:14px;font-family:inherit;margin-top:10px;outline:none;color:var(--ink)}
.dayH{font-size:16px;font-weight:800;margin:14px 0 0}
.trip{background:var(--card2);border-radius:14px;padding:12px 14px;margin-top:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}

.tripT b{font-size:13.5px;display:block}
.tripT span{font-size:12px;color:var(--muted);font-weight:600}
.tripS{text-align:right;flex-shrink:0}
.tripS b{font-size:15px}
.tripS small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.btn:disabled{opacity:.55}
/* telemetry+ */
.telHead{display:flex;gap:8px;align-items:stretch}
.gearBtn{width:48px;border:0;border-radius:14px;background:var(--card2);font-size:21px;cursor:pointer;color:var(--ink);font-family:inherit;flex-shrink:0}

.driveRow{display:flex;align-items:center;gap:12px;margin-top:10px}
.driveSel{border:0;background:var(--card);border-radius:12px;padding:11px 16px;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(120,100,70,.1);color:var(--ink);flex-shrink:0}

.h3col{display:grid;grid-template-columns:168px 1fr 250px;gap:10px;margin-top:12px;align-items:start}
.hsubcol{display:flex;flex-direction:column;gap:6px}
.hsub{border:0;background:var(--card2);border-radius:14px;padding:13px;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;text-align:left;color:var(--ink)}

.grow{display:grid;grid-template-columns:2.1fr 1fr 1fr;gap:10px;margin-top:10px}
.whcard{display:flex;gap:14px}
.whL{flex:1;min-width:0}
.whchart{width:100%;height:96px;display:block}
.whR{display:flex;gap:10px;align-items:stretch}
.vbar{width:10px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.vbar i{position:absolute;bottom:0;left:0;width:100%;height:62%;background:linear-gradient(180deg,#E8933C,#E86A33);border-radius:6px;display:block}
/* settings */
.setWrap{display:grid;grid-template-columns:212px 1fr;gap:10px;margin-top:12px;align-items:start}

.subH{font-size:14px;font-weight:800;margin:12px 0 2px;color:var(--ink)}

.tileBtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--card);border-radius:12px;padding:12px 14px;margin-top:8px;font-family:inherit;font-weight:800;font-size:14px;color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(120,100,70,.1);text-align:left}

.mBack{position:fixed;inset:0;background:rgba(30,25,15,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.mCard{background:var(--card);border-radius:22px;padding:20px;width:430px;max-width:94vw;box-shadow:0 24px 60px rgba(0,0,0,.3)}

.kpKey:active{background:var(--line)}
.kpSave{border:0;background:var(--btn);color:var(--onbtn);width:100%;border-radius:100px;padding:13px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:12px}
.thmName{font-size:13px;font-weight:800;color:var(--ink)}
.setInp{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:12px 14px;margin-top:8px;font-weight:800;font-size:15px}
.setInp input{border:0;background:transparent;font:inherit;width:100%;outline:0;color:var(--ink)}
.storeRow{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:8px;font-weight:800;font-size:14px}
.discl{display:flex;gap:10px;background:#FFF3D9;border-radius:14px;padding:12px 14px;margin-top:10px;font-size:13px;line-height:1.5;color:#6B5B3E}
/* toast */
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-12px);background:var(--btn);color:var(--onbtn);padding:10px 22px;border-radius:100px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:0;height:0}

.labBody{flex:1;overflow-y:auto;padding:12px 14px 24px}
.labGauge{background:var(--card2);border-radius:16px;padding:14px;display:flex;gap:14px;align-items:stretch}

.labScroll{overflow:auto}

.labC0{width:64px;flex-shrink:0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.labC1{flex:5;min-width:0;font-size:13px}

#telTripsHost{height:calc(100vh - 330px);min-height:520px;margin-top:12px}

/* скрим внутри обёртки меню должен быть ПОД меню (z в контексте обёртки),

/* ── Токены палитры «Инструментов» — res/values/colors.xml (light) и
   res/values-night/colors.xml (dark) CentralEXAuto_v3.3.9.apk. Тёмный
   набор включается, когда действующая палитра шелла светлая-или-тёмная
   (body[data-cx=dark] ставит applyCxDark() по яркости карточки темы). ── */
/* Токены объявлены на body (не на :root): палитра шелла живёт в правиле
   body[data-th="N"], и var(--card)/var(--ink) резолвятся только там — иначе
   панель всюду красилась бы значениями по умолчанию. */
body{
--cx-window:var(--card);--cx-surface:var(--card);--cx-surface-soft:var(--card);--cx-surface-inset:var(--card2);
--cx-sidebar:var(--card);--cx-divider:var(--line);--cx-border:var(--line);
--cx-text:var(--ink);--cx-text-secondary:var(--muted);--cx-text-muted:var(--muted2);
--cx-green:#34C759;--cx-green-soft:var(--card2);--cx-sel-bg:var(--sel);--cx-sel-fg:var(--onsel);
--cx-control:var(--track);--cx-off:var(--track);--cx-danger:#FF3B30;
--cx-accent-blue:#1677F2;--cx-android-blue:#1677F2}
body[data-cx=dark]{--cx-green:#30D158;--cx-danger:#FF6961}
/* ═══ Stage CXT · commit 1: дизайн-система «Инструментов» (CentralEXAuto) ═══
   Значения перенесены из ресурсов CentralEXAuto_v3.3.9.apk:
     цвет      res/values/colors.xml + res/values-night/colors.xml (master_*)
     размеры   res/values/dimens.xml (master_card_radius 18, master_sidebar_width 345,
               master_content_padding_h 54, master_content_padding_v 36, master_gap 20)
             res/values/styles.xml (MasterContentTitle 40/700, MasterToolsPageTitle 28/700,
               MasterToolsSectionHeader 23/700 + 52dip, MasterToolsOptionRow 72dip,
               MasterToolsSegmentButton 17, MasterToolsHelpIcon 34, MasterToolsSwitch)
     layout    res/layout/view_master_tools_content.xml (навигация 340dip, категория 62/72dip,
               пункт 54dip, индикатор 4×40dip, отступ метки 28dip, разделитель 1dip)
     switch    com.ex.auto.MasterToggleView (56×32dip, дорожка = радиус 16dip,
               бегунок r = 13dip, тень 1.5dip/0.8dip rgba(0,0,0,.2))
   ГУ Geely EX2: 1920×1080 при 160 DPI → 1 CSS-px == 1 dp, числа 1:1. */
.cx-root{display:flex;flex-direction:column;flex:1;min-height:0;box-sizing:border-box;color:var(--cx-text)}
.cx-title{font-size:40px;font-weight:700;line-height:1.15;color:var(--cx-text)}
.cx-sub{font-size:22px;color:var(--cx-text-secondary);margin-top:8px}
.cx-card{flex:1;min-height:0;margin-top:22px;background:var(--cx-surface);border:1px solid var(--cx-divider);border-radius:18px;padding:18px;display:flex;align-items:stretch;box-sizing:border-box}
.cx-nav{width:340px;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.cx-nav>*{flex-shrink:0;box-sizing:border-box}
.cx-cat{display:flex;align-items:center;gap:18px;min-height:72px;padding:0 12px 0 14px;border:0;background:transparent;color:var(--cx-text);font:inherit;text-align:left;border-radius:10px;cursor:pointer;box-sizing:border-box}
.cx-cat.grp{min-height:62px}
.cx-cat>svg{width:30px;height:30px;flex-shrink:0;stroke:var(--cx-text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cx-cat>b{flex:1;font-size:24px;font-weight:400;line-height:1.2}
.cx-chev{width:24px;height:24px;flex-shrink:0;transition:transform .16s ease}
.cx-chev svg{width:24px;height:24px;stroke:var(--cx-text-muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cx-cat[aria-expanded=true] .cx-chev svg,.cx-item[aria-expanded=true] .cx-chev svg{transform:rotate(90deg)}
.cx-items{display:none;flex-direction:column}
.cx-items.open{display:flex}
/* Уровни вложенности сдвигаем: категория (0) → Экран/Аудио (20dp) → CarPlay (48dp).
   В APK list пунктов идёт вложенным блоком внутри навигации, поэтому отступ
   задаётся контейнером, а не каждой строкой. */
.cx-items{padding-left:20px}
.cx-items .cx-items{padding-left:28px}
.cx-item{display:flex;align-items:center;height:54px;padding-right:12px;border:0;background:transparent;color:var(--cx-text);font:inherit;text-align:left;border-radius:10px;cursor:pointer}
.cx-item.sel{background:var(--cx-surface-inset)}
.cx-mark{width:4px;height:40px;margin-left:14px;border-radius:2px;background:transparent;flex-shrink:0}
.cx-item.sel .cx-mark{background:var(--cx-green)}
.cx-item>b{font-size:20px;font-weight:400;margin-left:28px;line-height:1.2}
.cx-item .cx-cnt{font-size:16px;color:var(--cx-text-secondary);margin-left:auto;padding-left:10px}
.cx-div{height:1px;background:var(--cx-divider);flex-shrink:0;margin:0 2px}
/* В навигации разделитель между категориям не должен касаться плашки
   выбранного пункта (на ГУ «Экран» сливался с линией) — по 10dp с двух сторон. */
.cx-nav>.cx-div{margin:10px 2px}
.cx-vdiv{width:1px;background:var(--cx-divider);margin:0 24px;flex-shrink:0}
.cx-page{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;padding-right:8px;box-sizing:border-box}
.cx-phead{display:flex;align-items:center;height:62px;padding-left:2px;flex-shrink:0}
.cx-phead>b{font-size:28px;font-weight:700;line-height:1.15}
.cx-help{width:34px;height:34px;padding:2px;margin-left:18px;border:0;border-radius:50%;background:transparent;cursor:pointer;flex-shrink:0}
.cx-help svg{width:26px;height:26px;stroke:var(--cx-text-muted);fill:none;stroke-width:1.8;stroke-linecap:round}
.cx-help:active,.cx-cat:active,.cx-item:active{background:var(--cx-surface-inset)}
.cx-cat:focus-visible,.cx-item:focus-visible,.cx-segb:focus-visible,.cx-btn:focus-visible,.cx-slider:focus-visible,.cx-help:focus-visible{outline:2px solid var(--cx-green);outline-offset:-2px}
/* Обводка только для навигации с кнопок ГУ (:focus-visible): нажатие пальцем
   по тумблеру не должно оставлять зелёное кольцо вокруг строки. */
.cx-toggle input:focus-visible+u{box-shadow:inset 0 0 0 1px var(--cx-divider),0 0 0 3px var(--cx-green)}
.cx-sect{display:flex;align-items:flex-end;height:52px;margin-top:16px;padding:0 2px 10px;font-size:23px;font-weight:700;color:var(--cx-text)}
.cx-phead+.cx-sect{margin-top:2px}
/* .cx-page — flex-колонка: без запрета сжатия строки уменьшались до
   min-height и содержимое (описание + заметка статуса) вылезало за границы
   строки → текст соседних строк и заголовки секций липли друг к другу. */
.cx-page>*{flex-shrink:0;box-sizing:border-box}
.cx-row{display:flex;align-items:center;gap:18px;min-height:72px;padding:16px 10px 16px 2px}
.cx-rowt{flex:1;min-width:0}
.cx-rowt>b{display:block;font-size:20px;font-weight:400;line-height:1.25}
.cx-rowt>small{display:block;font-size:14px;color:var(--cx-text-secondary);margin-top:6px;line-height:1.45}
.cx-note{display:block;font-size:13px;color:var(--cx-text-muted);margin-top:8px;min-height:15px;font-variant-numeric:tabular-nums}
.cx-note:empty{margin-top:0;min-height:0}
.cx-note[data-st=ok]{color:var(--cx-green)}
.cx-note[data-st=partial]{color:var(--cx-text-secondary)}
.cx-note[data-st=failed],.cx-note[data-st=blocked]{color:var(--cx-danger)}
.cx-seg{display:flex;height:48px;padding:4px;gap:4px;background:var(--cx-surface-inset);border:1px solid var(--cx-divider);border-radius:13px;flex-shrink:0;box-sizing:border-box}
.cx-segb{flex:1;min-width:64px;border:0;background:transparent;border-radius:12px;color:var(--cx-text-secondary);font:inherit;font-size:17px;white-space:nowrap;padding:0 14px;cursor:pointer}
.cx-segb.sel{background:var(--cx-sel-bg);color:var(--cx-sel-fg);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.cx-slider{-webkit-appearance:none;appearance:none;flex:1;min-width:120px;height:20px;background:transparent;cursor:pointer}
.cx-slider::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--cx-green) 0 var(--cx-p,50%),var(--cx-divider) var(--cx-p,50%) 100%)}
.cx-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:var(--cx-green);border:0;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cx-val{width:66px;text-align:right;font-size:18px;color:var(--cx-text);font-variant-numeric:tabular-nums;flex-shrink:0}
.cx-rowt-fix{width:170px;flex:none}
.cx-rowt-wide{width:210px;flex:none}
.cx-toggle{position:relative;display:inline-block;width:56px;height:32px;flex-shrink:0;cursor:pointer}
.cx-toggle input{position:absolute;opacity:0;width:0;height:0}
.cx-toggle u{position:absolute;inset:0;display:block;border-radius:16px;background:var(--cx-off);box-shadow:inset 0 0 0 1px var(--cx-divider);transition:background .18s;text-decoration:none}
.cx-toggle u:before{content:'';position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:3px;left:3px;box-shadow:0 .8px 1.5px rgba(0,0,0,.2);transition:transform .18s}
.cx-toggle input:checked+u{background:var(--cx-green)}
.cx-toggle input:checked+u:before{transform:translateX(24px)}
.cx-state{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 14px;border-radius:19px;background:var(--cx-surface-inset);border:1px solid var(--cx-divider);color:var(--cx-text-secondary);font-size:15px;font-weight:700;letter-spacing:.3px}
.cx-state.ok{background:var(--cx-surface);color:var(--cx-green);border-color:var(--cx-green)}
.cx-state.bad{background:var(--cx-surface);color:var(--cx-danger);border-color:var(--cx-danger)}
.cx-btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 16px;border:1.5px solid var(--cx-divider);border-radius:12px;background:var(--cx-surface-inset);color:var(--cx-text);font:inherit;font-size:15px;font-weight:700;letter-spacing:.3px;cursor:pointer;transition:all .15s ease;box-shadow:0 2px 6px rgba(0,0,0,.08);box-sizing:border-box}
.cx-btn:active{transform:scale(.98);background:var(--cx-divider)}
.cx-btn.primary{background:var(--cx-green);color:#fff;border-color:var(--cx-green);box-shadow:0 3px 10px rgba(52,199,89,.3)}
.cx-btn.primary:active{background:#28A745;border-color:#28A745}
.cx-btn.danger{background:transparent;color:var(--cx-danger);border-color:var(--cx-danger);box-shadow:0 2px 6px rgba(255,59,48,.12)}
.cx-btn.danger:active{background:rgba(255,59,48,.12)}
.cx-actions{display:flex;gap:12px;padding:10px 2px 14px}
.cx-actions .cx-btn{flex:1;min-width:0;white-space:nowrap}
.cx-chip{display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:19px;background:var(--cx-surface-inset);border:1px solid var(--cx-divider);color:var(--cx-text);font-size:16px}
.cx-themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;padding:4px 2px 14px}
.cx-themes .theme{background:var(--cx-surface-inset)}
.cx-empty{padding:24px 2px;font-size:18px;color:var(--cx-text-secondary)}

/* help-dialog строки */
.cx-helprow{padding:9px 0;border-bottom:1px solid var(--line)}
.cx-helprow:last-of-type{border-bottom:0}
.cx-helprow b{display:block;font-size:14px}
.cx-helprow small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}

<script>
window.__soundOpBusy = false;
window.__soundOpMsg = '';
window.__soundOpSuccess = null;

/* Имя выбранного файла: сначала имя из реестра, затем последний сегмент пути. */
function cxSoundName(name,path,fallback){
  if(name)return String(name);
  if(path)return String(path).split('/').pop();
  return fallback;
}
/* Экранирование подписей, которые приходят из native (пути, отчёты команд). */
function cxEsc(t){
  return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
/* Проверка фильтра по фронту без железа: значение уходит в тот же тракт, что и
   реальное событие свойства центрального замка (LockStateTrigger.injectForTest). */
function cxInjectLock(v){
  if(window.__geelyEmit)window.__geelyEmit('dev.injectLockEvent',{value:String(v)});
}
/* Перерисовка правой панели инструментов. Раньше звуковые кнопки вызывали
   cxRender(), которого в шелле нет вовсе: действие падало с ReferenceError ДО
   отправки события нативной стороне. Настоящая перерисовка — cxRepaintPage();
   она объявлена ниже по файлу, поэтому вызов отложен на тик. */
function cxRepaintTools(){
  if(typeof curId!=='undefined'&&curId!=='tools')return;
  setTimeout(function(){
    if(typeof cxRepaintPage==='function')cxRepaintPage();
    if(typeof cxPaintNotes==='function')cxPaintNotes();
  },0);
}
function cxSoundAction(action, msg) {
  if (window.__soundOpBusy) return;
  window.__soundOpBusy = true;
  window.__soundOpMsg = msg || 'Выполнение операции...';
  window.__soundOpSuccess = null;
  cxRepaintTools();

  if (action === 'copyUsb') {
    cxCopyUsbSounds();
  } else {
    cxAction(action);
  }
}

/* Канал результата — снимок tools.state с полем last (UiBridge.pushToolsState).
   Отдельного события «результат действия» native не шлёт, поэтому статус
   звуковой операции читается из того же снимка, что и сами строки. */
var CX_SOUND_ACTIONS = ['audio.copyFromUsb', 'audio.selectFile', 'audio.selectUnlockFile', 'audio.selectSoundName',
  'audio.preview', 'audio.previewUnlock', 'audio.restaurarSomTravaPersistente', 'audio.restoreFactoryUnlock',
  'settings.lockSound', 'settings.unlockSound', 'dev.probeLockSignal', 'dev.probeLockResult', 'dev.lockStatus',
  'dev.lockLog', 'dev.injectLockEvent', 'dev.testUnlockSound'];
var __cxLastResult = null;
window.__cxSoundResult = function(d){
  var res = d && d.last;
  if(!res || !res.action || CX_SOUND_ACTIONS.indexOf(res.action) < 0) return;
  /* Один и тот же снимок приходит на каждое действие (pushToolsState шлёт его
     целиком), поэтому результат показываем один раз — по действию и тексту. */
  var sig = res.action + '|' + (res.summary || '');
  if(sig === __cxLastResult) return;
  __cxLastResult = sig;
  window.__soundOpBusy = false;
  window.__soundOpSuccess = res.ok === true || res.status === 'ok';
  var st = (res.steps && res.steps.length) ? res.steps[res.steps.length - 1] : null;
  /* Причина показывается текстом шага: в FAILED backend кладёт класс исключения,
     его сообщение и цепочку cause (ToolsResult.describeThrowable). */
  var why = st ? (st.stderr || st.stdout || res.summary || '') : (res.summary || '');
  window.__soundOpMsg = (res.title || res.action) + ': ' + (why || (window.__soundOpSuccess ? 'применено' : 'ошибка'));
  cxRepaintTools();
};
</script>

   не выводятся. В браузере (без GeelyNative) вкладок проекции нет: avail
   честно false — наличие вкладки решает только настоящий presence. */
var PROJ={carplay:'unknown',androidAuto:'unknown',cpAt:null,aaAt:null,
          cpAvail:false,aaAvail:false};
let appTab=0,cpOn=false,aaOn=false; /* cpOn/aaOn — производные от PROJ (для карточек) */
/* Правило вкладок — дословный порт resolveProjectionTabs (capy,
   projection_presence_api.dart): тумблер выключен → протокол считается
   DISCONNECTED (вкладки нет); оба CONNECTED → выигрывает более новое ребро
   (равны/нет — обе вкладки честно true); ровно один CONNECTED → он единственный
   (unknown не ставит вторую вкладку рядом с видимым телефоном); ни одного →
   вкладка только при UNKNOWN && bound (fallback: рабочая карточка не должна
   прятаться из-за отказавшего зонда — чёрная карточка честнее пропавшей).
   bound в capy — привязка к render-сервису OEM (CarplayStatus.bound,
   приходит в PRST.carplay.bound пушем carplay.status). Для fallback-ветки
   unknown используем carplayAvailable из снимка presence — сервис заявлен
   на этом ГУ, карточка рабочая; смысл тот же, что у bound в capy: «a card
   that would have worked must not be hidden by a probe that failed». */
function resolveProjectionTabs(p,cpEn,aaEn,cpBound,aaBound){
  var cp=cpEn?p.carplay:'disconnected',aa=aaEn?p.androidAuto:'disconnected';
  if(cp==='connected'&&aa==='connected'){
    if(p.cpAt==null||p.aaAt==null||p.cpAt===p.aaAt)return{carplay:true,androidAuto:true};
    return{carplay:p.cpAt>p.aaAt,androidAuto:p.aaAt>p.cpAt};
  }
  if(cp==='connected')return{carplay:true,androidAuto:false};
  if(aa==='connected')return{carplay:false,androidAuto:true};
  return{carplay:cp==='unknown'&&cpBound,androidAuto:aa==='unknown'&&aaBound};
}
/* Прибытие телефона — только переход disconnected→connected (как _arrivedTab

   воткнутый до запуска, НЕ «прибыл» — вкладка сама не открывается. */
function arrivedTab(prev,next){
  if(prev.carplay==='disconnected'&&next.carplay==='connected')return'carplay';
  if(prev.androidAuto==='disconnected'&&next.androidAuto==='connected')return'aa';
  return null;
}

   списком вкладок). */

  cpOn=PROJ.carplay==='connected';aaOn=PROJ.androidAuto==='connected';
  var t=resolveProjectionTabs(PROJ,SET.proj,SET.proj,PROJ.cpAvail,PROJ.aaAvail);
  buildTabs();
  if(!t.carplay&&curId==='carplay')select('quick');
  if(!t.androidAuto&&curId==='aa')select('quick');
  if(PENDING_DEST==='carplay'&&t.carplay){select('carplay');PENDING_DEST=null}

/* Активация — по ребру, не на каждый render (как _requested в capy:
   «if (wanted == _requested) return» — rebuild UI не дёргает projection). */
function syncProjectionActivation(){
  var cur=stackOf(curId);
  if(cur===ACTIVE_STACK)return;
  if(ACTIVE_STACK&&window.__geelyEmit)window.__geelyEmit('projection.deactivate',{stack:ACTIVE_STACK});
  if(cur&&window.__geelyEmit)window.__geelyEmit('projection.activate',{stack:cur});
  ACTIVE_STACK=cur;
  if(cur){requestAnimationFrame(reportProjectionFrame);requestAnimationFrame(function(){requestAnimationFrame(reportProjectionFrame)})}
}
/* Рамка видео: getBoundingClientRect × devicePixelRatio — физические пиксели
   окна (WebView занимает всё окно, координаты совпадают). Натив кладёт
   TextureView ровно по этому прямоугольнику. */
function reportProjectionFrame(){
  var el=document.getElementById('projView');if(!el)return;
  var stack=stackOf(curId);if(!stack)return;
  try{
    /* Stage CPv4: full-bleed — контейнер зафиксирован в (0,0), ширина 100vw
       (CSS body.projfull); JS задаёт только низ: верхняя кромка плавающей
       панели минус зазор 10px. Прокрутка и разметка страницы не влияют. */
    if(tabbar){
      var hh=Math.floor(tabbar.getBoundingClientRect().top-10);
      el.style.height=Math.max(320,hh)+'px';
    }
    var nat=window.GeelyNative;
    var r=el.getBoundingClientRect(),d=window.devicePixelRatio||1;
    if(nat&&nat.projectionFrame)nat.projectionFrame(stack,r.left*d,r.top*d,r.width*d,r.height*d);
  }catch(e){}
}

    bufferHeight:d.bufferHeight||0,attachCount:d.attachCount||0,
    lastError:(d.lastError==null)?null:d.lastError};
  if(stackOf(curId)===stack)render(curId);
}

/* Палитра «Инструментов» живёт по своей светлой/тёмной паре (как master_* +
   values-night в APK), но выбор пары — за действующей палитрой шелла:
   считаем яркость карточки темы, чтобы панель не оставалась белой в ночи. */
function applyCxDark(){
  var eff=(SET.follow&&SET.gu==='dark')?1:setTheme;
  var hex=(THEMES[eff]&&THEMES[eff][2])||'#FFFFFF';
  var m=/^#?([0-9a-f]{6})$/i.exec(hex.replace('#',''));
  var dark=true;
  if(m){var v=parseInt(m[1],16),lum=(0.299*((v>>16)&255)+0.587*((v>>8)&255)+0.114*(v&255))/255;dark=lum<0.5}
  document.body.dataset.cx=dark?'dark':'light'
}

/* ── доступ к дереву ── */
function cxPages(){return TOOLS_PAGES}
function cxHasPage(node){return !!(node.page&&TOOLS_PAGES[node.page])}
function cxVisible(node){return cxHasPage(node)||(node.children||[]).some(cxVisible)}
function cxVisibleNodes(list){return list.filter(cxVisible)}
function cxWalk(list,fn){list.forEach(function(n){if(fn(n,list)===false)return;if(n.children)cxWalk(n.children,fn)})}
function cxFind(id){var r=null;cxWalk(TOOLS_TREE,function(n){if(n.id===id&&!r)r=n});return r}
function cxVisibleFirst(){var r=null;cxWalk(TOOLS_TREE,function(n){if(!r&&cxHasPage(n))r=n});return r}
/* Развернуты ли предки узла (для подсветки пути в дереве). */
function cxIsOpen(node){return node.children?TOOLS.open[node.id]===true:false}
function cxPathHas(id,list,acc){
  acc=acc||[];
  for(var i=0;i<list.length;i++){
    var n=list[i],p=acc.concat([n]);
    if(n.id===id){TOOLS._path=p;return true}
    if(n.children&&cxPathHas(id,n.children,p))return true
  }
  return false
}
function cxOpenPath(id){var l=cxVisibleNodes(TOOLS_TREE);TOOLS._path=null;cxPathHas(id,l);(TOOLS._path||[]).forEach(function(n){if(n.children)TOOLS.open[n.id]=true})}

/* ── компоненты (1:1 с Master* стилями APK) ── */
function cxIconEl(name){return CX_ICONS[name]||''}
function cxHelpBtn(page){return '<button class="cx-help" data-cxhelp="'+page+'" aria-label="'+CX_S.help+'" title="'+CX_S.help+'">'+CX_ICONS.help+'</button>'}
function cxPageHead(title,helpKey){return '<div class="cx-phead"><b>'+title+'</b>'+(helpKey?cxHelpBtn(helpKey):'')+'</div>'}
function cxSect(t){return '<div class="cx-sect">'+t+'</div>'}
function cxDiv(){return '<div class="cx-div"></div>'}
function cxNote(key){
  var r=cxResultFor(key);
  if(!r)return '<small class="cx-note" data-cxnote="'+key+'"></small>';
  return '<small class="cx-note" data-cxnote="'+key+'" data-st="'+r.status+'">'+r.summary+'</small>'
}
function cxResultFor(key){
  var last=TOOLS.last;
  if(!last) return null;
  if(last.action==='settings.'+key) return last;
  if(key==='copyUsb' && last.action==='audio.copyFromUsb') return last;
  if(key==='lockSoundFile' && (last.action==='audio.selectFile' || last.action==='audio.selectSoundName' || last.action==='audio.restaurarSomTravaPersistente')) return last;
  if(key==='unlockSoundFile' && (last.action==='audio.selectUnlockFile' || last.action==='audio.restoreFactoryUnlock')) return last;
  if(key==='lockSound' && (last.action==='audio.preview' || last.action==='settings.lockSound')) return last;
  if(key==='unlockSound' && (last.action==='audio.previewUnlock' || last.action==='settings.unlockSound')) return last;
  return null;
}
/* Строка с тумблером: MasterToolsOptionRow.Clickable + MasterToggleView. */
function cxToggleRow(o){
  /* Один источник истины: снимок реестра (appState/tools.state), затем SET шелла
     (до первого снимка), и только потом демо-значение разметки. */
  var on;
  if(TOOLS.state&&o.key in TOOLS.state){
    var v=TOOLS.state[o.key];
    on=(v==='0'||v===0)?false:!!v;
  }
  else if(o.key in SET)on=!!SET[o.key];
  else on=!!o.def;
  return '<div class="cx-row" data-cxrow="'+o.key+'"><div class="cx-rowt"><b>'+o.title+'</b>'
    +(o.desc?'<small>'+o.desc+'</small>':'')+cxNote(o.key)+'</div>'
    +'<label class="cx-toggle"><input type="checkbox" data-k="'+o.key+'" data-n="'+o.title+'"'+(on?' checked':'')+'><u></u></label></div>'
}
/* Строка с сегментами: MasterToolsSegmentButton в bg_master_segment. */
function cxSegRow(o){
  var cur=(TOOLS.state&&TOOLS.state[o.key])||o.def;
  var h='<div class="cx-row"><div class="cx-rowt-fix"><b>'+o.title+'</b></div><div class="cx-seg" style="width:'+(o.width||400)+'px">'
  o.opts.forEach(function(op){h+='<button class="cx-segb'+(op[0]===cur?' sel':'')+'" data-cxseg="'+o.key+'" data-v="'+op[0]+'">'+op[1]+'</button>'});
  return h+'</div></div>'
}
/* Строка со слайдером: SeekBar progressTint=master_green + MasterValueText. */
function cxSliderRow(o){
  var v=(TOOLS.state&&TOOLS.state[o.key]!=null)?+TOOLS.state[o.key]:o.def;
  return '<div class="cx-row" data-cxrow="'+o.key+'"><div class="'+(o.wide?'cx-rowt-wide':'cx-rowt-fix')+'"><b>'+o.title+'</b>'+cxNote(o.key)+'</div>'
    +'<input type="range" class="cx-slider" data-cxslider="'+o.key+'" data-unit="'+(o.unit||'')+'" min="'+o.min+'" max="'+o.max+'" step="'+(o.step||1)+'" value="'+v+'" style="--cx-p:'+((v-o.min)/(o.max-o.min)*100)+'%">'
    +'<div class="cx-val" data-cxval="'+o.key+'">'+v+(o.unit||'')+'</div></div>'
}
function cxStatePill(text,kind){return '<span class="cx-state'+(kind?' '+kind:'')+'">'+text+'</span>'}
function cxBtn(act,label,kind){return '<button class="cx-btn'+(kind?' '+kind:'')+'" data-cxact="'+act+'">'+label+'</button>'}

  h+=cxDiv();
  h+=cxSect(CX_S.page.sectionTheme);
  h+=cxSegRow({key:'gu',title:CX_S.page.themeHu,def:'light',width:260,
    opts:[['light','Светлая'],['dark','Тёмная']]});
  h+=cxDiv();
  h+=cxToggleRow({key:'follow',title:'Следовать теме ГУ',desc:CX_S.desc.follow,def:true});
  h+=cxDiv();
  h+='<div class="cx-row" style="align-items:flex-start"><div class="cx-rowt"><b>'+CX_S.page.themeApp
    +'</b><small>'+CX_S.page.themeAppHint+'</small></div></div>';
  h+='<div class="cx-themes">'+cxThemeTiles()+'</div>';
  return h

/* Плитки палитры — каталог THEMES шелла (тот же порядок, что capy_ui). */
function cxThemeTiles(){
  return THEMES.map(function(t,i){
    return '<button class="theme'+(setTheme===i?' sel':'')+'" data-cxtheme="'+THEME_IDS[i]+'">'
      +'<span class="thmPrev" style="background:'+t[1]+'"><span class="thmCard" style="background:'+t[2]+'">'
      +'<i style="background:'+t[3]+'"></i><span class="thmRow"><i style="background:'+t[4]+'"></i>'
      +'<span class="tdots"><i style="background:'+t[5]+'"></i><i style="background:'+t[6]+'"></i></span></span></span></span>'
      +'<span class="thmName">'+t[0]+(setTheme===i?' ✓':'')+'</span></button>'
  }).join('')
}

/* Реестр страниц: ключ дерева → реализация. Коммит N добавляет сюда свою
   страницу вместе с native-бэкендом, и узел появляется в дереве сам. */
/* ── страница «Звук блокировки замка» (§7 ТЗ) ── */
function cxPageLockSound(){
  var isBusy = window.__soundOpBusy || false;
  var busyMsg = window.__soundOpMsg || '';
  var busySuccess = window.__soundOpSuccess;

  var h=cxPageHead('Звуки замка (открытие и закрытие)','lockSound');

  // Плашка статуса операций
  if (busyMsg) {
    var bg = isBusy ? '#2c5282' : (busySuccess ? '#22543d' : '#742a2a');
    var icon = isBusy ? '⏳ ' : (busySuccess ? '✓ ' : '⚠️ ');
    h += '<div id="cx-sound-status-banner" style="margin: 12px 16px; padding: 12px 16px; border-radius: 8px; background: ' + bg + '; color: #fff; font-size: 14px; display: flex; align-items: center; gap: 8px; font-weight: 500;">'
       + icon + busyMsg + '</div>';
  }

  var disAttr = isBusy ? ' disabled style="opacity:0.4;pointer-events:none;"' : '';

  // Блок 0: Копирование с USB-накопителя (как в CentralEXAuto)
  h+=cxSect('Копирование аудио с USB-накопителя');
  h+='<div class="cx-row" data-cxrow="copyUsb"><div class="cx-rowt"><b>USB-накопитель</b><small>Вставьте флешку с файлами .wav, .mp3 или .ogg и нажмите «Копировать»</small>'+cxNote('copyUsb')+'</div>'
    +'<button class="cx-btn primary" onclick="cxSoundAction(\'copyUsb\', \'Копирование звуков с USB-накопителя...\')"' + disAttr + '>КОПИРОВАТЬ</button></div>';
  h+=cxDiv();
  h+=cxDiv();

  var avail = (TOOLS.state && TOOLS.state.availableSounds) || [];

  // Блок 1: Открытие дверей (разблокировка)
  h+=cxSect('Звук разблокировки (снятие с охраны)');
  h+='<div' + disAttr + '>'
    +cxToggleRow({key:'unlockSound',title:'Звук открытия / разблокировки',desc:'Играет при снятии машины с охраны: источник — свойство центрального замка, а не состояние дверей. Первое значение после подписки считается базовым, повтор состояния звука не даёт.',def:false})
    +'</div>';
  h+=cxDiv();
  var curUnlockName=(TOOLS.state&&TOOLS.state.unlockSoundName)||(TOOLS.state&&TOOLS.state.unlockSoundPath?TOOLS.state.unlockSoundPath.split('/').pop():'По умолчанию (заводской)');
  h+='<div class="cx-row" data-cxrow="unlockSoundFile"><div class="cx-rowt"><b>Звук открытия</b><small>'+curUnlockName+'</small>'+cxNote('unlockSoundFile')+'</div></div>';
  h+=cxDiv();

  /* Источник события замка и маршрут вывода: значения приходят из tools.state
     (реестр + состояние триггера + список устройств AudioTrack), а не из
     состояния страницы. */
  var trigSt=(TOOLS.state&&TOOLS.state.lockTriggerStatus)||'триггер не запущен';
  var routeSt=(TOOLS.state&&TOOLS.state.lockRoute)||'маршрут не определён';
  h+='<div class="cx-row" data-cxrow="lockTrigger"><div class="cx-rowt"><b>Сигнал замка (источник события)</b><small>'+cxEsc(trigSt)+'</small>'+cxNote('lockTrigger')+'</div></div>';
  h+=cxDiv();
  h+='<div class="cx-row" data-cxrow="lockRoute"><div class="cx-rowt"><b>Маршрут вывода</b><small>'+cxEsc(routeSt)+'</small></div></div>';
  h+=cxDiv();
  h+='<div class="cx-row cx-actions" style="gap:12px;display:flex;flex-wrap:wrap">'
    +'<button class="cx-btn primary" onclick="cxSoundAction(\'dev.probeLockSignal\', \'Подбор сигнала замка: 15 с, нажимайте брелок...\')"' + disAttr + '>ПОДОБРАТЬ СИГНАЛ</button>'
    +'<button class="cx-btn" onclick="cxSoundAction(\'dev.probeLockResult\', \'Читаю результат подбора...\')"' + disAttr + '>РЕЗУЛЬТАТ ПОДБОРА</button>'
    +'<button class="cx-btn" onclick="cxSoundAction(\'dev.lockStatus\', \'Снимаю состояние триггера...\')"' + disAttr + '>СОСТОЯНИЕ ТРИГГЕРА</button>'
    +'<button class="cx-btn" onclick="cxSoundAction(\'dev.lockLog\', \'Читаю лог перехвата...\')"' + disAttr + '>ЛОГ ПЕРЕХВАТА</button>'
    +'</div>';
  h+=cxDiv();
  h+='<div class="cx-row"><div class="cx-rowt"><b>Проверка фильтра по фронту</b><small>Значения уходят в тот же тракт, что и реальное событие свойства: первое — базовое (звук не играет), переход играет, повтор того же значения не играет.</small></div></div>';
  h+='<div class="cx-row cx-actions" style="gap:12px;display:flex;flex-wrap:wrap">'
    +'<button class="cx-btn" onclick="cxInjectLock(0)"' + disAttr + '>ПРОВЕРКА: ЗАКРЫТО (0)</button>'
    +'<button class="cx-btn" onclick="cxInjectLock(1)"' + disAttr + '>ПРОВЕРКА: ОТКРЫТО (1)</button>'
    +'</div>';
  h+=cxDiv();

  // Выпадающий список скопированных звуков для открытия
  var unlockOptions = '<option value="">-- Выберите звук из скопированных с USB --</option>';
  for (var i = 0; i < avail.length; i++) {
    var fn = avail[i];
    var sel = (curUnlockName === fn) ? ' selected' : '';
    unlockOptions += '<option value="' + fn + '"' + sel + '>' + fn + '</option>';
  }
  h+='<div class="cx-row"><div class="cx-rowt"><b>Список скопированных звуков</b><small>Доступно: ' + avail.length + ' файлов</small></div>'
    +'<select class="cx-select" style="background:var(--cx-surface-inset);color:var(--cx-text);border:1px solid var(--cx-divider);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;max-width:280px;" onchange="cxSelectSoundItem(this.value, false)"' + disAttr + '>' + unlockOptions + '</select></div>';
  h+=cxDiv();

  h+='<div class="cx-row cx-actions" style="gap:12px;display:flex">'
    +'<button class="cx-btn primary" onclick="cxSoundAction(\'audio.selectUnlockFile\', \'Выбор и сохранение звука открытия...\')"' + disAttr + '>ВЫБРАТЬ ИЗ ФАЙЛОВ</button>'
    +'<button class="cx-btn" onclick="cxSoundAction(\'audio.previewUnlock\', \'Воспроизведение звука открытия в салоне...\')"' + disAttr + '>ПРОСЛУШАТЬ</button>'
    +'<button class="cx-btn danger" onclick="cxSoundAction(\'audio.restoreFactoryUnlock\', \'Сброс звука открытия к заводскому...\')"' + disAttr + '>СБРОС К ЗАВОДСКОМУ</button>'
    +'</div>';
  h+=cxDiv();
  h+=cxDiv();

  // Блок 2: Закрытие замка (блокировка)
  h+=cxSect('Звук блокировки замка (закрытие)');
  h+='<div' + disAttr + '>'
    +cxToggleRow({key:'lockSound',title:'Кастомный звук замка',desc:CX_S.desc.lockSound,def:false})
    +'</div>';
  h+=cxDiv();
  var curLockName=(TOOLS.state&&TOOLS.state.lockSoundName)||(TOOLS.state&&TOOLS.state.lockSoundPath?TOOLS.state.lockSoundPath.split('/').pop():'Заводской (Geely OEM)');
  h+='<div class="cx-row" data-cxrow="lockSoundFile"><div class="cx-rowt"><b>Выбранный звук</b><small>'+curLockName+'</small>'+cxNote('lockSoundFile')+'</div></div>';
  h+=cxDiv();

  // Выпадающий список скопированных звуков для закрытия
  var lockOptions = '<option value="">-- Выберите звук из скопированных с USB --</option>';
  for (var i = 0; i < avail.length; i++) {
    var fn = avail[i];
    var sel = (curLockName === fn) ? ' selected' : '';
    lockOptions += '<option value="' + fn + '"' + sel + '>' + fn + '</option>';
  }
  h+='<div class="cx-row"><div class="cx-rowt"><b>Список скопированных звуков</b><small>Доступно: ' + avail.length + ' файлов</small></div>'
    +'<select class="cx-select" style="background:var(--cx-surface-inset);color:var(--cx-text);border:1px solid var(--cx-divider);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;max-width:280px;" onchange="cxSelectSoundItem(this.value, true)"' + disAttr + '>' + lockOptions + '</select></div>';
  h+=cxDiv();

  h+='<div class="cx-row cx-actions" style="gap:12px;display:flex">'
    +'<button class="cx-btn primary" onclick="cxSoundAction(\'audio.selectFile\', \'Выбор и сохранение звука закрытия...\')"' + disAttr + '>ВЫБРАТЬ ИЗ ФАЙЛОВ</button>'
    +'<button class="cx-btn" onclick="cxSoundAction(\'audio.preview\', \'Воспроизведение звука закрытия в салоне...\')"' + disAttr + '>ПРОСЛУШАТЬ</button>'
    +'<button class="cx-btn danger" onclick="cxSoundAction(\'audio.restaurarSomTravaPersistente\', \'Восстановление заводского звука Geely OEM...\')"' + disAttr + '>СБРОС К ЗАВОДСКОМУ</button>'
    +'</div>';
  h+=cxDiv();
  h+=cxDiv();

  // Блок 3: Общие настройки
  h+=cxSect('Настройки громкости и задержки');
  h+='<div' + disAttr + '>'
    +cxSliderRow({key:'lockSoundVol',title:'Громкость',min:5,max:100,unit:'%',def:80,wide:true})
    +'</div>';
  h+=cxDiv();
  h+='<div' + disAttr + '>'
    +cxSegRow({key:'lockSoundDelay',title:'Задержка звука',def:'0',width:360,
      opts:[['0','0 мс'],['150','150 мс'],['300','300 мс']]})
    +'</div>';
  h+=cxDiv();
  h+='<div class="cx-row"><div class="cx-rowt"><b>'+CX_S.page.lockSoundHelpTitle+'</b><small>'+CX_S.page.lockSoundHelpText+'</small></div></div>';
  return h;
}
function cxCopyUsbSounds(){
  if(window.__geelyEmit) window.__geelyEmit('audio.copyFromUsb', {});
  else if(window.GeelyNative) window.GeelyNative.postMessage(JSON.stringify({type:'audio.copyFromUsb'}));
}

function cxSelectSoundItem(fileName, isLock){
  if(!fileName) return;
  var payload = {name: fileName, isLock: isLock};
  if(window.__geelyEmit) window.__geelyEmit('audio.selectSoundName', payload);
  else if(window.GeelyNative) window.GeelyNative.postMessage(JSON.stringify({type:'audio.selectSoundName', data: JSON.stringify(payload)}));
}

/* ── левая панель: категории и вложенные пункты ── */
function cxNavHTML(){
  var h='';

    if(ci)h+='<div class="cx-div"></div>';

        +cxIconEl(cat.icon)+'<b>'+cat.label+'</b><span class="cx-chev">'+CX_ICONS.chevron+'</span></button>';

    }else{

        +'<b>'+cat.label+'</b></button>'

function cxChildrenHTML(node){
  var h='';
  cxVisibleNodes(node.children||[]).forEach(function(ch){
    if(ch.children){
      /* Промежуточная группа (Аудио) — как вложенная категория CentralEXAuto:
         без иконки, с собственным раскрытием. */

function toolsView(){
  /* Если текущий узел ещё не реализован (первый запуск, половина срезов не
     сделана), подсвечиваем первый доступный — пустой правой панели нет. */
  var node=cxFind(TOOLS.sel);
  if(!node||!cxHasPage(node)){var f=cxVisibleFirst();TOOLS.sel=f?f.id:null;node=f}
  if(node)cxOpenPath(node.id);
  var h='<div class="cx-root"><div class="cx-title">'+CX_S.title+'</div><div class="cx-sub">'+CX_S.subtitle+'</div>';
  h+='<div class="cx-card"><div class="cx-nav" id="cxNav">'+cxNavHTML()+'</div><div class="cx-vdiv"></div>';
  h+='<div class="cx-page" id="cxPage">'+(node?TOOLS_PAGES[node.page]():'')+'</div>';
  return h+'</div></div>'
}

/* Перерисовка правой панели без потери прокрутки (у панели свой scroll). */
function cxRepaintPage(){
  var page=document.getElementById('cxPage');if(!page)return;
  var node=cxFind(TOOLS.sel);
  var top=page.scrollTop;
  page.innerHTML=node&&cxHasPage(node)?TOOLS_PAGES[node.page]():(TOOLS.state?'':'');
  page.scrollTop=top;
  toolsWire();
}
function cxRepaintNav(){
  var nav=document.getElementById('cxNav');if(!nav)return;
  var top=nav.scrollTop;
  nav.innerHTML=cxNavHTML();
  nav.scrollTop=top;
  toolsWire();
}
/* Статус readback под контролом — обновляется на месте, без пересборки. */
function cxPaintNotes(){
  var page=document.getElementById('cxPage');if(!page)return;
  page.querySelectorAll('[data-cxnote]').forEach(function(n){
    var r=cxResultFor(n.getAttribute('data-cxnote'));
    if(!r){n.textContent='';n.removeAttribute('data-st');return}
    n.textContent=r.summary;n.setAttribute('data-st',r.status)
  })
}
function cxSyncControls(){
  if(!TOOLS.state)return;
  var page=document.getElementById('cxPage');if(!page)return;
  page.querySelectorAll('.cx-toggle input[data-k]').forEach(function(i){
    var k=i.getAttribute('data-k');
    if(k in TOOLS.state&&i.checked!==!!TOOLS.state[k])i.checked=!!TOOLS.state[k]
  });
  page.querySelectorAll('[data-cxseg]').forEach(function(b){
    var k=b.getAttribute('data-cxseg');
    if(TOOLS.state[k]!==undefined)b.classList.toggle('sel',b.getAttribute('data-v')===TOOLS.state[k])
  });
  /* Слайдер яркости: снимок реестра — единственный источник значения. Если
     запись не подтвердилась (FAILED), backend присылает фактический уровень,
     и ползунок возвращается к нему — откат оптимистичного значения. */
  page.querySelectorAll('[data-cxslider]').forEach(function(s){
    var k=s.getAttribute('data-cxslider');
    if(TOOLS.state[k]===undefined)return;
    var v=+TOOLS.state[k];
    if(s.value!==String(v))s.value=v;
    s.style.setProperty('--cx-p',((v-s.min)/(s.max-s.min)*100)+'%');
    var val=page.querySelector('[data-cxval="'+k+'"]');
    if(val)val.textContent=v+(s.getAttribute('data-unit')||'')
  });
  /* Имя файла в строке — ВСЕГДА из снимка реестра, в том числе когда он пуст:
     иначе после неудачного выбора или сброса к заводскому в строке оставалось
     прежнее имя, и UI показывал выбор, которого на машине нет. */
  var lockEl=page.querySelector('[data-cxrow="lockSoundFile"] small');
  if(lockEl)lockEl.textContent=cxSoundName(TOOLS.state.lockSoundName,TOOLS.state.lockSoundPath,'Заводской (ключ ГУ пуст)');
  var unlockEl=page.querySelector('[data-cxrow="unlockSoundFile"] small');
  if(unlockEl)unlockEl.textContent=cxSoundName(TOOLS.state.unlockSoundName,TOOLS.state.unlockSoundPath,'Не выбран');
  var trigEl=page.querySelector('[data-cxrow="lockTrigger"] small');
  if(trigEl)trigEl.textContent=TOOLS.state.lockTriggerStatus||'триггер не запущен';
  var routeEl=page.querySelector('[data-cxrow="lockRoute"] small');
  if(routeEl)routeEl.textContent=TOOLS.state.lockRoute||'маршрут не определён';
}

/* ── проводка ── */
function toolsWire(){
  var root=document.getElementById('cxPage');
  var nav=document.getElementById('cxNav');
  if(!root||!nav)return;
  nav.querySelectorAll('[data-cxcat]').forEach(function(b){
    b.onclick=function(){var id=b.getAttribute('data-cxcat');TOOLS.open[id]=!TOOLS.open[id];cxRepaintNav()}
  });
  document.querySelectorAll('#cxNav [data-cxitem],#cxPage [data-cxitem]').forEach(function(b){
    b.onclick=function(){cxSelect(b.getAttribute('data-cxitem'))}
  });
  /* Stage CXT fix: строка больше НЕ кликабельна — значение меняет только
     сам тумблер (нажатие по подписи раньше переворачивало флаг второй раз и
     выглядело как «работает только текст»). */
  root.querySelectorAll('.cx-toggle input[data-k]').forEach(function(i){
    i.onchange=function(){
      var k=i.getAttribute('data-k');
      if(!TOOLS.state)TOOLS.state={};TOOLS.state[k]=i.checked;
      /* SET шелла обязан получить то же значение СРАЗУ: applyClim()/applyProjection()
         читают SET, иначе полоса климата ехала на шаг позади тумблера.
         Запись и readback — по-прежнему одним каналом settings.change (см. ниже). */
      if(k in SET)SET[k]=i.checked;
      if(typeof say==='function'&&i.getAttribute('data-n'))say(i.getAttribute('data-n')+(i.checked?' · вкл':' · выкл'));
      if(k==='cb')applyClim();if(k==='follow')applyTheme();if(k==='proj')applyProjection();
      cxPaintNotes()
    }
  });
  root.querySelectorAll('[data-cxseg]').forEach(function(b){
    b.onclick=function(){cxSet(b.getAttribute('data-cxseg'),b.getAttribute('data-v'))}
  });
  root.querySelectorAll('[data-cxtheme]').forEach(function(b){
    b.onclick=function(){cxSetTheme(b.getAttribute('data-cxtheme'))}
  });
  root.querySelectorAll('[data-cxhelp]').forEach(function(b){
    b.onclick=function(){cxHelpOpen(b.getAttribute('data-cxhelp'))}
  });
  root.querySelectorAll('[data-cxslider]').forEach(function(s){
    var val=root.querySelector('[data-cxval="'+s.getAttribute('data-cxslider')+'"]');
    s.oninput=function(){
      var pct=(s.value-s.min)/(s.max-s.min)*100;
      s.style.setProperty('--cx-p',pct+'%');
      if(val)val.textContent=s.value+(s.getAttribute('data-unit')||'');
      cxPendingSlider(s)
    };
    s.onchange=function(){
      var k=s.getAttribute('data-cxslider');
      cxSet(k,+s.value)
    }
  });
  root.querySelectorAll('[data-cxact]').forEach(function(b){
    b.onclick=function(){cxAction(b.getAttribute('data-cxact'),b)}
  });
}
function cxSelect(id){
  var node=cxFind(id);
  if(!node||!cxHasPage(node))return;
  TOOLS.sel=id;cxOpenPath(id);
  /* Путь до узла раскрываем перерисовкой дерева: выбор из скрытой группы не
     должен оставлять правую панель без подсветки слева. */
  cxRepaintNav();
  cxRepaintPage();
  var page=document.getElementById('cxPage');if(page)page.scrollTop=0
}
/* Запись настройки: единственный канал — settings.change → ToolsBackend.
  Локального «оптимистичного» состояния нет: UI ждёт снимок tools.state. */
function cxSet(key,value){
  if(!TOOLS.state)TOOLS.state={};
  TOOLS.state[key]=value;
  if(key in SET)SET[key]=value;
  /* Живой эффект светлой/тёмной темы ГУ и следования ей — сразу, как в
     CentralEXAuto (сегмент применяет состояние, не дожидаясь ответа). */
  if(key==='gu'||key==='follow')applyTheme();
  if(window.__geelyEmit)window.__geelyEmit('settings.change',{key:key,value:value})
}
var cxSliderTimer=0;
function cxPendingSlider(s){
  /* Слайдер применяется с паузой, как в CentralEXAuto (нет шторма записей
     яркости на каждый пикселя перетаскивания). */
  clearTimeout(cxSliderTimer);
  cxSliderTimer=setTimeout(function(){cxSet(s.getAttribute('data-cxslider'),+s.value)},220)
}
function cxSetTheme(id){
  var i=THEME_IDS.indexOf(id);if(i<0)return;
  setTheme=i;applyTheme();cxSet('theme',id);
  var sc=(document.getElementById('cxPage')||{}).scrollTop||0;
  cxRepaintPage();
  var p=document.getElementById('cxPage');if(p)p.scrollTop=sc
}
function cxAction(act,btn){
  if(!window.__geelyEmit)return;
  /* Выбор файла: прежний <input type=file> в WebView не работал вовсе — у
     WebChromeClient не переопределён onShowFileChooser, поэтому имя файла до
     native не доезжало. Файл выбирает системный ACTION_OPEN_DOCUMENT на
     нативной стороне (UiBridge.openDocumentPicker → MainActivity.onActivityResult):
     оттуда берётся FLAG_GRANT_READ_URI_PERMISSION + takePersistableUriPermission,
     содержимое копируется в /data/local/tmp/sons и пишутся ключи реестра. */
  if(act==='audio.selectUnlockFile'||act==='audio.selectFile'){
    window.__geelyEmit(act,{});
    return;
  }
  if(act.indexOf('audio.')===0||act.indexOf('dev.')===0){
    /* У кнопок проверки фронта значение берётся из data-inject — событие уходит
       в тот же тракт, что и реальное значение свойства замка. */
    var payload={};
    var inj=btn&&btn.getAttribute?btn.getAttribute('data-inject'):null;
    if(inj!==null&&inj!==undefined)payload.value=String(inj);
    window.__geelyEmit(act,payload);
  }else{
    window.__geelyEmit('tools.action',{action:act});
  }
}

/* Нативный снимок состояния (appState при загрузке, tools.state после
   каждого изменения) — единственный источник для всех контролов. */
function toolsApplyState(d){
  if(!d)return;
  /* Мост может прислать как объект, так и строку (evaluateJavascript) —
     приводим к объекту, чтобы состояние не распалось на символы. */
  if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){return}}
  TOOLS.state=Object.assign({},TOOLS.state||{},d);
  TOOLS.last=d.last||TOOLS.last;
  var s=TOOLS.state;
  /* SET шелла читает те же значения: телеметрия, хром окна и полоса климата
     используют те же ключи, что и реестр настроек. */
  if('imm' in s)SET.imm=!!s.imm;
  if('wake' in s)SET.wake=!!s.wake;
  if('cb' in s)SET.cb=!!s.cb;
  if('proj' in s)SET.proj=!!s.proj;
  if('follow' in s)SET.follow=!!s.follow;
  if('gu' in s)SET.gu=s.gu;
  /* Выбор палитры (setTheme) — только свой или подтверждённая запись плиток:
     снимок мог прийти с действующей палитрой (follow+тёмная тема ГУ), и приём
     её за выбор ломал возврат на светлую. Первый снимок — единственный, когда
     шелл ещё ничего не выбирал. */
  if('theme' in s&&THEME_IDS.indexOf(s.theme)>=0){
    var confirmed=d.last&&d.last.action==='settings.theme'
    if(!TOOLS.themeSeeded||confirmed){setTheme=THEME_IDS.indexOf(s.theme);TOOLS.themeSeeded=true}
  }
  /* Снимок реестра мог принести другую палитру (первая отрисовка идёт до
     appState) — применяем действующую, если она разошлась с телом. */
  var effNow=(SET.follow&&SET.gu==='dark')?1:setTheme;
  if(String(document.body.dataset.th)!==String(effNow))applyTheme();
  /* Полоса климата и панель проекции тоже зависят от SET — применяем их после
     снимка, иначе первая отрисовка расходилась с тумблерами (полоса «наоборот»). */
  if(typeof applyClim==='function')applyClim();
  if(typeof applyProjection==='function')applyProjection();
  if(curId==='tools'){
    /* Список файлов с флешки и плашка статуса строятся при рендере страницы, а
       не в cxSyncControls, поэтому снимок реестра перерисовывает панель. */
    cxSyncControls();cxPaintNotes();
    if(window.__cxSoundResult)window.__cxSoundResult(d);
    if(d.availableSounds||d.last)cxRepaintTools();
  }
  var bad=d.last&&d.last.ok===false;
  if(bad&&typeof say==='function')say(d.last.title+': '+d.last.summary)
}

 /* GeelyTools deviation: встроенная телеметрия открывается самой вкладкой

  content.querySelectorAll('[data-gu]').forEach(b=>b.onclick=()=>{content.querySelectorAll('[data-gu]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');SET.gu=b.dataset.gu;say(b.dataset.gu==='dark'?'Тема ГУ · тёмная':'Тема ГУ · светлая');applyTheme()});
 content.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{setTheme=+b.dataset.theme;say(THEMES[setTheme][0]);applyTheme();render(curId)});
 content.querySelectorAll('[data-k]').forEach(s=>s.onchange=()=>{SET[s.dataset.k]=s.checked;if(TOOLS.state&&s.dataset.k in TOOLS.state)TOOLS.state[s.dataset.k]=s.checked;say(s.dataset.n+(s.checked?' · вкл':' · выкл'));const k=s.dataset.k;if(k==='follow')applyTheme();if(k==='cb')applyClim();if(k==='proj')applyProjection();if(k==='imm'){const st=content.scrollTop;render(curId);uiRestore(st)}});
 content.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>setAct(b.dataset.act,b));
 if(cxChrome)toolsWire();
/* Stage T2: обработчики старого экрана энергии (ewWinBtn/etrack/ewChart) удалены — экран «Поездки» ведёт tel-trips.js */
/* Stage T3: обработчики старого экрана зарядки (chgChart/ctab/presets/limSlider/amps/force/chgStop) удалены — экран ведёт tel-charge.js */
