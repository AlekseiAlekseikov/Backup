name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # ubuntu-latest приходит с уже установленным Android SDK — берём его,
      # а не ставим заново через setup-android (пакет 'tools' удалён из
      # репозитория Google, из-за него прогон 41052836550 упал на шаге «Android SDK»).
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get (flutter_telemetry)
        working-directory: flutter_telemetry
        run: flutter pub get

      - name: Flutter build AAR (flutter_telemetry)
        working-directory: flutter_telemetry
        run: flutter build aar --release

      - name: Android SDK packages
        run: |
          set -e
          SDK="$ANDROID_SDK_ROOT"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          echo "sdkmanager: $SM"
          "$SM" --version
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: local.properties (путь к SDK, ключи Supabase сохраняем)
        run: |
          set -e
          if grep -q '^sdk.dir=' local.properties; then
            sed -i "s|^sdk.dir=.*|sdk.dir=$ANDROID_SDK_ROOT|" local.properties
          else
            echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          fi
          echo "--- sdk.dir ---"; grep '^sdk.dir=' local.properties
          echo "--- ключи Supabase на месте: ---"
          grep -c '^SUPABASE_' local.properties

      - name: Sanity check (что нужно для сборки на месте)
        run: |
          echo "--- ключи подписи ---"; ls -la platform-keys/ || true
          echo "--- jniLibs ---";      ls -la app/src/main/jniLibs/arm64-v8a/ || true
          echo "--- l10n ---";         ls -la flutter_telemetry/lib/l10n/ || true
          echo "--- flutter AAR repo ---"; ls -la flutter_telemetry/build/host/outputs/repo/ || true

      - name: Gradle build (debug)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/logs/**/*
          if-no-files-found: warn
          retention-days: 30
